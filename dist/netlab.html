<script>
// ===================== NetLab Storage-Modell =====================
// Pools (RAID), LUNs, LUN-Masking (Storage) und Zoning (FC-Switch). Reine Logik auf dem Netz-JSON.
const STOR = (function () {
  const N = typeof NL !== 'undefined' ? NL : require('./engine.js');
  const RAID = {
    raid0: { name: 'RAID 0', min: 2, fault: 0, usable: n => n, note: 'Striping, keine Ausfallsicherheit' },
    raid1: { name: 'RAID 1', min: 2, even: true, fault: 1, usable: n => n / 2, note: 'Spiegel' },
    raid5: { name: 'RAID 5', min: 3, fault: 1, usable: n => n - 1, note: 'eine Parität, 1 Platte darf ausfallen' },
    raid6: { name: 'RAID 6', min: 4, fault: 2, usable: n => n - 2, note: 'zwei Paritäten, 2 Platten dürfen ausfallen' },
    raid10: { name: 'RAID 10', min: 4, even: true, fault: 1, usable: n => n / 2, note: 'Spiegel mit Striping, je Spiegel 1 Platte' }
  };
  const DISKS = [600, 1200, 1800, 3840];
  const THIN_INITIAL = 0.1;

  const st = d => d.stor || (d.stor = { pools: [], luns: [], seq: 0 });
  const poolOf = (d, name) => st(d).pools.find(p => p.name === name);
  const lunSize = l => l.gb;
  const lunAlloc = l => l.thin ? Math.ceil(l.gb * THIN_INITIAL) : l.gb;
  function poolInfo(d, p) {
    const r = RAID[p.raid], raw = p.disks * p.diskGb, usable = r.usable(p.disks) * p.diskGb;
    const luns = st(d).luns.filter(l => l.pool === p.name), alloc = luns.reduce((s, l) => s + lunAlloc(l), 0), prov = luns.reduce((s, l) => s + l.gb, 0);
    return { raw, usable, alloc, free: usable - alloc, prov, over: prov > usable, fault: r.fault, luns };
  }
  function createPool(d, o) {
    const S = st(d), name = String(o.name || '').trim(), r = RAID[o.raid], n = +o.disks, gb = +o.diskGb;
    if (!/^[A-Za-z][\w-]{0,23}$/.test(name)) return { err: 'Poolname: Buchstaben, Ziffern, - und _ (max. 24 Zeichen, beginnt mit Buchstabe).' };
    if (S.pools.some(p => p.name === name)) return { err: `Einen Pool „${name}“ gibt es schon.` };
    if (!r) return { err: 'Unbekannter RAID-Level.' };
    if (!(n >= r.min)) return { err: `${r.name} braucht mindestens ${r.min} Platten.` };
    if (r.even && n % 2) return { err: `${r.name} braucht eine gerade Plattenzahl.` };
    if (n > 24) return { err: 'Höchstens 24 Platten pro Pool.' };
    if (!DISKS.includes(gb)) return { err: 'Unbekannte Plattengröße.' };
    S.pools.push({ name, raid: o.raid, disks: n, diskGb: gb }); return { ok: true };
  }
  function deletePool(d, name) { const S = st(d); if (S.luns.some(l => l.pool === name)) return { err: `Im Pool „${name}“ liegen noch LUNs. Erst die LUNs löschen.` }; S.pools = S.pools.filter(p => p.name !== name); return { ok: true }; }

    if (d.type !== 'server' || A.isCloud(d)) return null;
    return d.os === 'windows' ? 'windows' : (A.VIRT.isHost(d) ? 'hypervisor' : 'linux');
  };
  const PRODUCT = { linux: ['Server-Web-Konsole', 'Linux'], hypervisor: ['Virtualisierungs-Manager', 'Hypervisor'], windows: ['Server-Manager', 'Windows Server 2022'], storage: ['Storage-Manager', 'Speichersystem'], fabric: ['Fabric-Manager', 'FC-Switch'] };
  const hasGui = d => !!kindOf(d);

  // ---------- kleine UI-Bausteine ----------
  const attrs = o => Object.entries(o || {}).map(([k, v]) => `data-${k}="${esc(v)}"`).join(' ');
  const btn = (label, act, data, cls) => `<button type="button" class="wg-b ${cls || ''}" data-act="${act}" ${attrs(data)}>${label}</button>`;
  const chip = (t, k) => `<span class="wg-chip ${k || ''}">${t}</span>`;
  const tbl = (head, rows, empty) => rows.length ? `<div class="wg-ts"><table class="wg-t"><thead><tr>${head.map(h => `<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.map(r => `<tr>${r.map(c => `<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>` : `<p class="wg-empty">${empty || 'Keine Einträge.'}</p>`;
  const field = (id, label, val, o = {}) => `<div class="wg-f"><label for="wf-${id}">${label}</label><input id="wf-${id}" ${o.type ? `type="${o.type}"` : ''} value="${esc(val == null ? '' : val)}" ${o.ph ? `placeholder="${esc(o.ph)}"` : ''} ${o.min != null ? `min="${o.min}"` : ''} ${o.max != null ? `max="${o.max}"` : ''} autocomplete="off" spellcheck="false">${o.hint ? `<small>${o.hint}</small>` : ''}</div>`;
  const sel = (id, label, opts, cur, hint) => `<div class="wg-f"><label for="wf-${id}">${label}</label><select id="wf-${id}">${opts.map(([v, t]) => `<option value="${esc(v)}" ${String(v) === String(cur) ? 'selected' : ''}>${esc(t)}</option>`).join('')}</select>${hint ? `<small>${hint}</small>` : ''}</div>`;
  const bar = (used, total, warn) => { const p = total ? Math.min(100, Math.round(used / total * 100)) : 0; return `<div class="wg-bar" role="img" aria-label="${p} Prozent"><i class="${p >= (warn || 90) ? 'hot' : ''}" style="width:${p}%"></i></div>`; };
  const gb = n => n >= 1024 ? (n / 1024).toFixed(1).replace('.0', '') + ' TB' : n + ' GB';
  const card = (title, body, cls) => `<section class="wg-card ${cls || ''}"><h3>${title}</h3>${body}</section>`;
  const failed = out => /(^|\n)(\S+ : |error:|E: |bash: |Failed |Job for |.*Permission denied|.*not found|.*failed)/i.test(String(out || ''));

  // ---------- Fenster / Zustand ----------
  function create(devId, root, o = {}) {
    const G = { id: devId, page: null, dlg: null, msg: null, log: [], file: null, tab: {}, auth: !!SESS[devId] || !!o.auth, chrome: !!o.chrome, onClose: o.onClose };
    const dev = () => A.net().devs[devId], kind = () => kindOf(dev());
    const draw = () => {
      const d = dev(); if (!d) { root.innerHTML = '<p class="wg-empty">Das Gerät gibt es nicht mehr.</p>'; return; }
      const k = kind(), main = root.querySelector('.wg-main'), top = main ? main.scrollTop : 0, ip = hostIp(d);
      if (!k) { root.innerHTML = '<p class="wg-empty">Dieses Gerät hat keine Weboberfläche.</p>'; return; }
      const url = `https://${ip || d.cfg.hostname.toLowerCase()}:${PORT}/`;
      const chrome = G.chrome ? `<div class="wg-chrome"><span class="wg-dots"><i></i><i></i><i></i></span><div class="wg-url" title="${esc(url)}"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg><span>${esc(url)}</span>${ip ? '' : '<em>Direktzugriff (keine IP-Adresse)</em>'}</div><button class="wg-x" data-act="close" aria-label="Fenster schließen">✕</button></div>` : '';
      if (!G.auth) { root.innerHTML = `<div class="wg-win">${chrome}<div class="wg-login wg-${k}"><form class="wg-lc" data-act="login"><div class="wg-logo">${logo(k)}</div><h2>${PRODUCT[k][0]}</h2><p>${esc(d.cfg.hostname)} · ${PRODUCT[k][1]}</p>${field('user', 'Benutzername', k === 'windows' ? 'Administrator' : 'admin')}${field('pw', 'Kennwort', 'NetLab-2026', { type: 'password' })}<button type="submit" class="wg-b primary wide" data-act="login">Anmelden</button><small>Simulator-Zugangsdaten sind vorausgefüllt.</small></form></div></div>`; return; }
      const nav = NAV[k](d), pg = G.page && nav.some(n => n[0] === G.page) ? G.page : nav[0][0]; G.page = pg;
      let body = ''; try { body = PAGES[k][pg](d, G) } catch (e) { body = `<p class="wg-empty">Fehler beim Laden der Seite: ${esc(e.message)}</p>`; console.error(e); }
      root.innerHTML = `<div class="wg-win">${chrome}<div class="wg-app wg-${k}">
        <header class="wg-top"><div class="wg-brand">${logo(k)}<b>${PRODUCT[k][0]}</b><span>${esc(d.cfg.hostname)}</span></div><div class="wg-user"><span>${k === 'windows' ? 'Administrator' : 'admin'}</span>${btn('Abmelden', 'logout', null, 'ghost sm')}</div></header>
        <div class="wg-body"><nav class="wg-nav" aria-label="Navigation">${nav.map(([id, lbl]) => `<button type="button" class="${id === pg ? 'act' : ''}" data-act="nav" data-p="${id}" ${id === pg ? 'aria-current="page"' : ''}>${lbl}</button>`).join('')}</nav>
        <div class="wg-main" role="main" tabindex="-1"><div class="wg-ph"><h1>${nav.find(n => n[0] === pg)[1]}</h1></div>${G.msg ? `<div class="wg-msg ${G.msg.err ? 'err' : 'ok'}" role="status">${esc(G.msg.t)}</div>` : ''}${body}</div></div>
        ${G.log.length ? `<footer class="wg-log"><b>Letzte Aktionen (gleichwertig im Terminal)</b>${G.log.slice(-3).map(l => `<code class="${l.err ? 'err' : ''}">${esc(l.cmd)}</code>`).join('')}</footer>` : ''}
        ${G.dlg ? dlgHtml(d, G) : ''}</div></div>`;
      const m = root.querySelector('.wg-main'); if (m && top) m.scrollTop = top;
      const f = root.querySelector('.wg-dlg input, .wg-dlg select'); if (f && G._focus !== G.dlg) { f.focus(); G._focus = G.dlg; }
      if (G.page === 'terminal') { const o = root.querySelector('#wg-out'); if (o) o.scrollTop = 1e9; const i = root.querySelector('#wg-cmd'); if (i && !G.dlg) i.focus(); }
    };
    G.draw = draw; G.dev = dev; G.root = root; G.kind = kind; return G;
  }
  const logo = k => `<svg class="wg-ico" viewBox="0 0 24 24" aria-hidden="true">${{ linux: '<rect x="3" y="4" width="18" height="6" rx="1.5"/><rect x="3" y="14" width="18" height="6" rx="1.5"/><path d="M7 7h.01M7 17h.01"/>', hypervisor: '<rect x="3" y="3" width="8" height="8" rx="1.5"/><rect x="13" y="3" width="8" height="8" rx="1.5"/><rect x="3" y="13" width="18" height="8" rx="1.5"/>', windows: '<path d="M3 5l8-1.2V11H3zM13 3.6L21 2v9h-8zM3 13h8v7.2L3 19zM13 13h8v9l-8-1.6z"/>', storage: '<ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v14c0 1.7 3.6 3 8 3s8-1.3 8-3V5M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/>', fabric: '<circle cx="12" cy="12" r="3"/><circle cx="4" cy="5" r="2"/><circle cx="20" cy="5" r="2"/><circle cx="4" cy="19" r="2"/><circle cx="20" cy="19" r="2"/><path d="M6 6l4 4M18 6l-4 4M6 18l4-4M18 18l-4-4"/>' }[k]}</svg>`;
  const hostIp = d => { const h = d.ports.map(p => A.hip(d, p)).find(x => x && x.ip); return h ? h.ip : ''; };

  // ---------- Navigation ----------
  const NAV = {
    linux: d => [['overview', 'Übersicht'], ['network', 'Netzwerk'], ['services', 'Dienste'], ['files', 'Konfigurationsdateien'], ['storage', 'Speicher'], ['firewall', 'Firewall'], ['software', 'Software'], ['virt', 'Virtualisierung'], ['terminal', 'Terminal']],
    hypervisor: d => [['overview', 'Übersicht'], ['vms', 'Virtuelle Maschinen'], ['vswitch', 'Virtueller Switch'], ['datastores', 'Datastores'], ['cluster', 'Cluster und HA'], ['network', 'Netzwerk'], ['services', 'Dienste'], ['files', 'Konfigurationsdateien'], ['storage', 'Speicher'], ['firewall', 'Firewall'], ['software', 'Software'], ['terminal', 'Terminal']],
    windows: d => [['dashboard', 'Dashboard'], ['local', 'Lokaler Server'], ['roles', 'Rollen und Features'], ['ad', 'Active Directory'], ['dns', 'DNS'], ['dhcp', 'DHCP'], ['shares', 'Dateidienste'], ['services', 'Dienste'], ['firewall', 'Firewall'], ['terminal', 'PowerShell']],
    storage: d => [['dashboard', 'Dashboard'], ['pools', 'Speicherpools'], ['luns', 'LUNs'], ['hosts', 'Hosts und Zugriff'], ['ports', 'Ports und Controller']],
    fabric: d => [['dashboard', 'Dashboard'], ['ports', 'Ports'], ['zoning', 'Zoning'], ['fabric', 'Fabric']]
  };

  // ---------- Aktionen ausführen ----------
  function exec(G, cmds, ok) {
    const d = G.dev(); cmds = [].concat(cmds); let last = '';
    for (const c of cmds) { let out = ''; A.act(() => { out = A.exec(d, c); }); const bad = failed(out); G.log.push({ cmd: (A.isWn(d) ? 'PS> ' : '$ ') + c, err: bad }); last = out; if (bad) { G.msg = { err: true, t: String(out).split('\n').filter(Boolean).slice(0, 3).join(' ') }; G.log = G.log.slice(-8); return false; } }
    G.msg = ok ? { t: ok } : null; G.log = G.log.slice(-8); return last || true;
  }
  const res = (G, r, ok) => { G.msg = r && r.err ? { err: true, t: r.err } : (ok ? { t: ok } : null); return !(r && r.err); };
  const v = (G, id) => { const e = G.root.querySelector('#wf-' + id); return e ? (e.type === 'checkbox' ? e.checked : e.value) : ''; };

  // ---------- Seiten ----------
  const PAGES = { linux: {}, hypervisor: {}, windows: {}, storage: {}, fabric: {} };
  const ifaces = d => A.ctx().ifaces(d);
  const maskLen = m => m ? m.split('.').reduce((a, x) => a + (+x).toString(2).replace(/0/g, '').length, 0) : '';

  // --- gemeinsame Linux-Seiten ---
  const LX = {
    overview(d, G) {
      const L = A.LX.init(d), du = A.LX.diskUse(d), us = A.LX.unitList(d), ifs = ifaces(d);
      return `<div class="wg-grid">${card('System', `<dl class="wg-dl"><dt>Hostname</dt><dd>${esc(d.cfg.hostname)} ${btn('Ändern', 'dlg', { k: 'host' }, 'sm ghost')}</dd><dt>Betriebssystem</dt><dd>Ubuntu 22.04.4 LTS</dd><dt>Laufzeit</dt><dd>2 Std. 14 Min.</dd><dt>Benutzer</dt><dd>${esc(L.users.join(', '))}</dd></dl>`)}
        ${card('Ressourcen', `<p class="wg-k">Prozessor</p>${bar(4, 100)}<p class="wg-s">4 % von ${d.hv ? d.hv.cores : 4} Kernen</p><p class="wg-k">Arbeitsspeicher</p>${bar(612, 3900)}<p class="wg-s">612 MB von 3,8 GB</p><p class="wg-k">Systemplatte</p>${bar(du.used, du.total, 85)}<p class="wg-s">${gb(Math.round(Math.min(du.used, du.total) / 1073741824))} von ${gb(Math.round(du.total / 1073741824))}${du.full ? ' – <b class="wg-bad">voll</b>' : ''}</p>`)}
        ${card('Netzwerk', ifs.length ? `<dl class="wg-dl">${ifs.map(i => `<dt>${esc(i.lin)}</dt><dd>${i.ip ? esc(i.ip + '/' + maskLen(i.mask)) : '<span class="wg-mut">keine IP</span>'} ${chip(i.up ? 'verbunden' : 'getrennt', i.up ? 'ok' : 'bad')}</dd>`).join('')}<dt>Gateway</dt><dd>${esc(d.cfg.gw || '–')}</dd><dt>DNS</dt><dd>${esc(d.cfg.dns || '–')}</dd></dl>` : '<p class="wg-empty">Keine Netzwerkkarte.</p>')}
        ${card('Dienste', `<p class="wg-big">${us.filter(u => u.active).length}<small> laufen</small></p>${us.some(u => u.failed) ? `<p>${chip(us.filter(u => u.failed).length + ' fehlgeschlagen', 'bad')}</p>` : '<p class="wg-mut">Keine Fehler.</p>'}${btn('Zu den Diensten', 'nav', { p: 'services' }, 'sm')}`)}</div>`;
    },
    network(d, G) {
      const ifs = ifaces(d);
      return card('Schnittstellen', tbl(['Name', 'Status', 'IPv4-Adresse', 'MAC-Adresse', ''], ifs.map((i, k) => [`<b>${esc(i.lin)}</b>`, chip(i.up ? 'verbunden' : 'getrennt', i.up ? 'ok' : 'bad'), i.ip ? esc(i.ip + '/' + maskLen(i.mask)) : '–', `52:54:00:12:34:${(k + 10).toString(16)}`, btn('Bearbeiten', 'dlg', { k: 'net', i: i.lin }, 'sm')]), 'Keine Netzwerkkarte.'))
        + card('Routing und DNS', `<dl class="wg-dl"><dt>Standard-Gateway</dt><dd>${esc(d.cfg.gw || 'nicht gesetzt')}</dd><dt>DNS-Server</dt><dd>${esc(d.cfg.dns || 'nicht gesetzt')}</dd></dl>${btn('Gateway und DNS ändern', 'dlg', { k: 'gw' }, 'sm')}`);
    },
    services(d, G) {
      const us = A.LX.unitList(d);
      return card('Systemdienste', tbl(['Dienst', 'Beschreibung', 'Status', 'Autostart', 'Aktionen'], us.map(u => [`<b>${esc(u.name)}</b>${u.port ? `<br><small class="wg-mut">Port ${esc(u.port)}</small>` : ''}`, esc(u.desc), u.active ? chip('läuft', 'ok') : u.failed ? chip('fehlgeschlagen', 'bad') : chip('gestoppt'), `<label class="wg-sw"><input type="checkbox" data-act="enable" data-u="${esc(u.name)}" ${u.enabled ? 'checked' : ''} aria-label="Autostart ${esc(u.name)}"><i></i></label>`, `<div class="wg-row">${u.active ? btn('Stoppen', 'svc', { u: u.name, c: 'stop' }, 'sm') + btn('Neu starten', 'svc', { u: u.name, c: 'restart' }, 'sm') : btn('Starten', 'svc', { u: u.name, c: 'start' }, 'sm primary')}${btn('Protokoll', 'dlg', { k: 'log', u: u.name }, 'sm ghost')}</div>`]), 'Keine Dienste.'))
        + '<p class="wg-note">Hinweis: Dienste lesen ihre Konfiguration beim Starten. Änderungen unter „Konfigurationsdateien“ wirken nach einem Neustart des Dienstes.</p>';
    },
    files(d, G) {
      const A_ = A.LX, L = A_.init(d), fl = A_.fileList(d); if (!G.file || !fl.includes(G.file)) G.file = fl.find(f => /nginx\.conf|db\.lab|dhcpd\.conf/.test(f)) || fl[0];
      const txt = G.file ? (L.fs[G.file] && L.fs[G.file].t) || '' : '', map = { 'nginx.conf': 'nginx', 'db.lab': 'bind9', 'dhcpd.conf': 'isc-dhcp-server' }, u = Object.keys(map).find(k => G.file && G.file.endsWith(k));
      return `<div class="wg-split"><aside class="wg-files"><h3>Dateien</h3>${fl.map(f => `<button type="button" class="${f === G.file ? 'act' : ''}" data-act="file" data-f="${esc(f)}">${esc(f)}</button>`).join('') || '<p class="wg-empty">Keine Dateien.</p>'}${btn('Neue Datei', 'dlg', { k: 'newfile' }, 'sm ghost')}</aside>
        <div class="wg-edit">${G.file ? `<div class="wg-row"><b>${esc(G.file)}</b></div><textarea id="wf-text" spellcheck="false" aria-label="Dateiinhalt">${esc(txt)}</textarea><div class="wg-row">${btn('Speichern', 'savefile', null, 'primary')}${/nginx\.conf$/.test(G.file) ? btn('Syntax prüfen (nginx -t)', 'nginxt', null) : ''}${u ? btn(`${map[u]} neu starten`, 'svc', { u: map[u], c: 'restart', save: 1 }) : ''}</div><p class="wg-note">Systemdateien darf nur root ändern, die Oberfläche speichert als Administrator.</p>` : '<p class="wg-empty">Wähle eine Datei.</p>'}</div></div>`;
    },
    storage(d, G) {
      const ctx = A.ctx(), bi = A.LX.blockInfo(ctx, d), df = A.exec(d, 'df -h'), lb = A.exec(d, 'lsblk');
      return card('Datenträger und LUNs', `<div class="wg-row">${btn('Neu scannen', 'run', { c: 'sudo rescan-scsi-bus.sh', ok: 'SCSI-Bus gescannt.' }, 'primary')}${btn('Dateisystem anlegen', 'dlg', { k: 'mkfs' }, bi.length ? '' : 'disabled')}${btn('Einbinden', 'dlg', { k: 'mount' }, bi.length ? '' : 'disabled')}</div>` + tbl(['LUN', 'Gerät', 'Größe', 'Pfade', 'Dateisystem', 'Eingebunden'], bi.map(x => [`<b>${esc(x.name)}</b>`, `<code>${esc(x.dev)}</code>`, gb(x.gb), x.paths.length + (x.multipath ? ' (Multipath)' : ' (je Pfad ein Gerät)'), esc(x.fs || '–'), esc(x.mounts.join(', ') || '–')]), 'Keine SAN-LUNs sichtbar. Prüfe Masking, Zoning und starte einen Rescan.'))
        + card('Blockgeräte (lsblk)', `<pre class="wg-pre">${esc(lb)}</pre>`) + card('Belegung (df -h)', `<pre class="wg-pre">${esc(df)}</pre>`);
    },
    firewall(d, G) {
      const U = A.LX.ufwState(d);
      return card('Firewall (ufw)', `<p>Status: ${U.on ? chip('aktiv', 'ok') : chip('inaktiv', 'bad')} ${U.on ? btn('Deaktivieren', 'run', { c: 'sudo ufw disable' }, 'sm') : btn('Aktivieren', 'run', { c: 'sudo ufw enable' }, 'sm primary')}</p>${U.on && !U.allow.includes('22') ? '<p class="wg-warn">SSH (Port 22) ist nicht erlaubt: Beim Aktivieren sperrst du dich per SSH aus.</p>' : ''}` + tbl(['Erlaubter Port', 'Aktion'], U.allow.map(p => [`<b>${esc(p)}</b>`, btn('Entfernen', 'run', { c: 'sudo ufw delete allow ' + p }, 'sm ghost')]), 'Keine Regeln. Ist die Firewall aktiv, wird alles Eingehende blockiert.') + `<div class="wg-row">${btn('Port freigeben', 'dlg', { k: 'allow' }, 'primary')}</div>`);
    },
    software(d, G) {
      return card('Pakete', tbl(['Paket', 'Beschreibung', 'Status', ''], A.LX.pkgList(d).map(p => [`<b>${esc(p.name)}</b>`, esc(p.desc), p.installed ? chip('installiert', 'ok') : chip('verfügbar'), p.installed ? btn('Entfernen', 'run', { c: 'sudo apt remove ' + p.name }, 'sm ghost') : btn('Installieren', 'run', { c: 'sudo apt install ' + p.name, ok: p.name + ' installiert.' }, 'sm primary')])))
        + '<p class="wg-note">Die Installation braucht IP-Adresse, Gateway und eine Verbindung ins Internet. Sonst meldet apt, dass es die Paketquellen nicht erreicht.</p>';
    },
    terminal(d, G) {
      const lines = A.termOut(d);
      return `<div class="wg-term" id="wg-out" role="log" aria-live="polite">${lines.map(o => `<div class="k-${o.c}">${esc(o.t) || '&nbsp;'}</div>`).join('')}</div><form class="wg-termin" data-act="term"><label for="wg-cmd">${esc(A.prompt(d))}</label><input id="wg-cmd" autocomplete="off" spellcheck="false" aria-label="Befehl"></form>`;
    }
  };
  Object.assign(PAGES.linux, LX, {
    virt(d, G) { return card('Virtualisierung', `<p>Dieser Server ist kein Hypervisor. Ein Hypervisor lässt mehrere virtuelle Maschinen auf einem Server laufen. Sie hängen an einem virtuellen Switch, dessen Uplinks die Netzwerkports des Servers sind.</p>${A.VIRT.vmsOf(A.net(), d.id).length ? '' : btn('Als Hypervisor einrichten', 'hvon', null, 'primary')}`); }
  });
  Object.assign(PAGES.hypervisor, LX);

  // --- Hypervisor ---
  const VIRT = A_ => A_.VIRT;
  PAGES.hypervisor.overview = (d, G) => {
    const vm = A.VIRT, net = A.net(), ur = vm.usedRam(net, d.id), uc = vm.usedCpu(net, d.id), vms = vm.vmsOf(net, d.id), du = A.LX.diskUse(d);
    return `<div class="wg-grid">${card('Host', `<dl class="wg-dl"><dt>Hostname</dt><dd>${esc(d.cfg.hostname)} ${btn('Ändern', 'dlg', { k: 'host' }, 'sm ghost')}</dd><dt>Kerne</dt><dd>${d.hv.cores}</dd><dt>Arbeitsspeicher</dt><dd>${d.hv.ramGb} GB</dd><dt>Cluster</dt><dd>${esc(d.hv.cluster || 'keiner')}</dd><dt>vSwitch</dt><dd>${esc(d.vsw.name)}, Uplinks: ${esc(d.vsw.uplinks.join(', ') || 'keine')}</dd></dl>`)}
      ${card('Kapazität', `<p class="wg-k">Arbeitsspeicher (fest vergeben)</p>${bar(ur, d.hv.ramGb, 85)}<p class="wg-s">${ur} von ${d.hv.ramGb} GB belegt</p><p class="wg-k">vCPUs (${vm.OVERCOMMIT}:1 Überbuchung)</p>${bar(uc, d.hv.cores * vm.OVERCOMMIT, 90)}<p class="wg-s">${uc} von ${d.hv.cores * vm.OVERCOMMIT}</p><p class="wg-k">Systemplatte</p>${bar(du.used, du.total, 85)}`)}
      ${card('Virtuelle Maschinen', `<p class="wg-big">${vms.filter(v => v.vm.state === 'running').length}<small> von ${vms.length} laufen</small></p>${btn('Zur Verwaltung', 'nav', { p: 'vms' }, 'sm')}`)}
      ${card('Dienste', `<p class="wg-big">${A.LX.unitList(d).filter(u => u.active).length}<small> laufen</small></p>${btn('Zu den Diensten', 'nav', { p: 'services' }, 'sm')}`)}</div>`;
  };

      switch (k) {

        case 'net': { const ip = v(G, 'ip').trim(), len = v(G, 'len'); if (!ip) { G.msg = { err: true, t: 'IP-Adresse fehlt.' }; ok = false; break; } E(`sudo ip addr add ${ip}/${len} dev ${x.i}`, 'Schnittstelle konfiguriert.'); break; }

        case 'vmedit': A.act(() => { const vm = net.devs[x.v]; let r = A.VIRT.setVlan(vm, v(G, 'vl')); if (!r.err && vm.vm.state !== 'running') vm.vm.ds = v(G, 'ds'); ok = res(G, r, 'VM gespeichert.'); }); if (ok) { const ip = v(G, 'ip').trim(), gw = v(G, 'gw').trim(), vm = net.devs[x.v]; if (ip) { let o = ''; A.act(() => { o = A.exec(vm, `ip ${ip}${gw ? ' ' + gw : ''}`); }); if (failed(o) || /nicht|ungültig|invalid/i.test(o)) { G.msg = { err: true, t: String(o).split('\n')[0] }; ok = false; } } } break;

        case 'rename': E(`Rename-Computer -NewName ${v(G, 'n')}`, 'Name wird nach dem Neustart gültig.'); break;
        case 'join': E(`Add-Computer -DomainName ${v(G, 'dom')} -Credential ${v(G, 'usr')}`, 'Der Domäne beigetreten.'); break;
        case 'wnet': E([`New-NetIPAddress -InterfaceAlias ${x.i} -IPAddress ${v(G, 'ip')} -PrefixLength ${v(G, 'len')}${v(G, 'gw') ? ' -DefaultGateway ' + v(G, 'gw') : ''}`].concat(v(G, 'dns') ? [`Set-DnsClientServerAddress -InterfaceAlias ${x.i} -ServerAddresses ${v(G, 'dns')}`] : []), 'Adapter konfiguriert.'); break;
        case 'forest': E(`Install-ADDSForest -DomainName ${v(G, 'dom')} -SafeModeAdministratorPassword (ConvertTo-SecureString "${v(G, 'pw')}" -AsPlainText -Force) -Force`, 'Gesamtstruktur erstellt. Der Server ist jetzt Domänencontroller.'); break;
        case 'newuser': E(`New-ADUser -Name "${v(G, 'n')}" -SamAccountName ${v(G, 'sam')} -AccountPassword (ConvertTo-SecureString "${v(G, 'pw')}" -AsPlainText -Force) -Enabled $true${v(G, 'ou') ? ` -Path "OU=${v(G, 'ou')},${A.WIN.dn(W(dv).domain.name)}"` : ''}`, 'Benutzer erstellt.'); break;

        case 'addmember': E(`Add-ADGroupMember -Identity "${v(G, 'g')}" -Members ${v(G, 'u')}`, 'Mitglied hinzugefügt.'); break;
        case 'newou': E(`New-ADOrganizationalUnit -Name ${v(G, 'n')}`, 'Organisationseinheit erstellt.'); break;

        case 'newscope': E(`Add-DhcpServerv4Scope -Name ${v(G, 'n')} -StartRange ${v(G, 's')} -EndRange ${v(G, 'e')} -SubnetMask ${v(G, 'm')}`, 'Bereich erstellt. Setze die Optionen und starte den Dienst.'); break;

    // ---- System Engineer: Linux-Server ----
    { id: 'sc-lx-web', kind: 'Fehlersuche', title: 'Linux: nginx startet nicht', est: '10 min',
      intro: 'Auf WEB-01 (Ubuntu) läuft der Webserver nicht, und die Seite ist von PC-1 aus nicht erreichbar. Seit der letzten Änderung an der Konfiguration ist nginx ausgefallen. Melde dich über das Terminal von WEB-01 an (Doppelklick auf das Gerät oder Reiter „Konsole“) und finde die Ursache mit <code>systemctl</code>, <code>journalctl</code> und <code>nginx -t</code>.',
      build(net) { lxBase(net, 'WEB-01'); lxr(net, 'WEB-01', ["sudo sed -i 's/listen 80;/listen 80/' /etc/nginx/nginx.conf", 'sudo systemctl disable nginx', 'sudo systemctl restart nginx']); },
      goals: [
        { t: 'Die Konfiguration <code>/etc/nginx/nginx.conf</code> ist fehlerfrei', c: n => !!LXN.nginxCheck(hd(n, 'WEB-01').lx).ok },
        { t: 'Der Dienst nginx läuft (<code>systemctl is-active nginx</code> = active)', c: n => !!hd(n, 'WEB-01').svc.http.on },
        { t: 'nginx startet beim Booten automatisch (<code>enabled</code>)', c: n => !!hd(n, 'WEB-01').lx.units.nginx.enabled },
        { t: 'PC-1 ruft <code>http://10.0.0.10</code> erfolgreich ab', c: n => { const d = hd(n, 'PC-1'); return !!d && !!httpGet(d, 'http://10.0.0.10').ok; } }],
      hints: ['<code>systemctl status nginx</code> zeigt „failed“. Die Fehlermeldung steht im Journal: <code>journalctl -u nginx -n 10</code>.', 'Mit <code>sudo nginx -t</code> prüfst du die Konfiguration. Die Meldung nennt die Zeile und die Direktive, bei der ein Semikolon fehlt.', 'Datei ändern: <code>sudo sed -i \'s/listen 80$/listen 80;/\' /etc/nginx/nginx.conf</code>. Danach <code>sudo systemctl restart nginx</code> und <code>sudo systemctl enable nginx</code>.'],
      sol(net) { lxr(net, 'WEB-01', ["sudo sed -i 's/listen 80$/listen 80;/' /etc/nginx/nginx.conf", 'sudo systemctl enable nginx', 'sudo systemctl restart nginx']); } },
    { id: 'sc-lx-disk', kind: 'Fehlersuche', title: 'Linux: Festplatte ist voll', est: '10 min',
      intro: 'Die Intranet-Seite auf WEB-01 ist ausgefallen. Ein Dienst schreibt seit Wochen Debug-Logs, und die Festplatte ist voll. Finde die große Datei, schaffe Platz, ohne die Datei zu löschen (der Dienst, der sie schreibt, braucht sie), und bringe nginx wieder hoch.',
      build(net) { lxBase(net, 'WEB-01'); const d = hd(net, 'WEB-01'), L = LXN.init(d); L.fs['/var/log/app'] = { d: 1, o: 'root' }; L.fs['/var/log/app/debug.log'] = { t: '', s: 19 * 1024 ** 3, o: 'root', m: '644' }; lxr(net, 'WEB-01', 'sudo systemctl restart nginx'); },
      goals: [
        { t: 'Die Festplatte ist wieder unter 90 % belegt (<code>df -h</code>)', c: n => LXN.used(hd(n, 'WEB-01').lx) < 0.9 * LXN.TOTAL },
        { t: 'Die Datei <code>/var/log/app/debug.log</code> existiert noch, ist aber leer', c: n => { const e = hd(n, 'WEB-01').lx.fs['/var/log/app/debug.log']; return !!e && !e.s && !(e.t || '').length; } },
        { t: 'nginx läuft wieder', c: n => !!hd(n, 'WEB-01').svc.http.on },
        { t: 'PC-1 lädt <code>http://10.0.0.10</code>', c: n => { const d = hd(n, 'PC-1'); return !!d && !!httpGet(d, 'http://10.0.0.10').ok; } }],
      hints: ['<code>df -h</code> zeigt 100 % auf <code>/</code>. Den Verursacher findest du mit <code>sudo find / -size +1G</code> oder <code>sudo du -sh /var/log/*</code>.', 'Eine Logdatei, die ein Prozess offen hält, leert man mit <code>sudo truncate -s 0 &lt;Datei&gt;</code>. Löschen würde den Platz nicht sauber freigeben.', 'Danach: <code>sudo systemctl restart nginx</code>.'],
      sol(net) { lxr(net, 'WEB-01', ['sudo truncate -s 0 /var/log/app/debug.log', 'sudo systemctl restart nginx']); } },
    { id: 'sc-lx-dns', kind: 'Aufbau', title: 'Linux: DNS-Server mit bind9', est: '15 min',
      intro: 'NS-01 ist ein frischer Ubuntu-Server mit IP-Adresse, aber ohne Dienste. Installiere bind9, lege die Zone <code>lab.local</code> mit dem Eintrag <code>intranet.lab.local → 10.0.0.10</code> an und sorge dafür, dass PC-1 den Namen auflöst. Den Gateway-Router erreicht der Server, deshalb funktioniert <code>apt</code>.',
      build(net) { lxBase(net, 'NS-01', true); },
      goals: [
        { t: 'Das Paket <code>bind9</code> ist installiert', c: n => hd(n, 'NS-01').lx.pkgs.includes('bind9') },
        { t: 'Die Zonendatei <code>/etc/bind/db.lab</code> enthält einen A-Record für <code>intranet</code> mit 10.0.0.10', c: n => /intranet\s+IN\s+A\s+10\.0\.0\.10/.test(LXN.readFile(hd(n, 'NS-01').lx, '/etc/bind/db.lab') || '') },
        { t: 'Der Dienst bind9 läuft und kennt den Eintrag', c: n => { const sv = hd(n, 'NS-01').svc; return !!sv.dns.on && sv.dns.records.some(r => r.name === 'intranet.lab.local'); } },
        { t: 'PC-1 nutzt <code>10.0.0.10</code> als DNS-Server', c: n => hd(n, 'PC-1').cfg.dns === '10.0.0.10' },
        { t: 'PC-1 löst <code>intranet.lab.local</code> auf', c: n => { const d = hd(n, 'PC-1'); return !!d && !!resolve(d, 'intranet.lab.local').ip; } }],
      hints: ['<code>sudo apt update</code> und <code>sudo apt install bind9</code>.', 'Eintrag anhängen: <code>echo "intranet IN A 10.0.0.10" | sudo tee -a /etc/bind/db.lab</code>. Die Datei <code>db.lab</code> gibt es noch nicht, <code>tee -a</code> legt sie an. Der Zonenname ist <code>lab.local</code>.', 'Zone laden: <code>sudo systemctl restart bind9</code>. Der Client trägt den DNS-Server in der IP-Konfiguration (Desktop) ein. Prüfen mit <code>nslookup intranet.lab.local</code> auf PC-1.'],
      sol(net) { lxr(net, 'NS-01', ['sudo apt install bind9', "echo '$ORIGIN lab.local.' | sudo tee /etc/bind/db.lab", 'echo "intranet IN A 10.0.0.10" | sudo tee -a /etc/bind/db.lab', 'sudo systemctl restart bind9']); hd(net, 'PC-1').cfg.dns = '10.0.0.10'; } },
    { id: 'sc-lx-dhcp', kind: 'Aufbau', title: 'Linux: DHCP-Server einrichten', est: '15 min',
      intro: 'PC-2 soll seine Adresse automatisch bekommen. Richte auf DHCP-01 (Ubuntu) den Dienst <code>isc-dhcp-server</code> ein: Pool 10.0.0.100 bis 10.0.0.150, Gateway 10.0.0.1. Danach holt PC-2 eine Adresse (im Planer: Doppelklick auf PC-2 → Eingabeaufforderung → <code>ipconfig /renew</code>).',
      build(net) { lxBase(net, 'DHCP-01', true); mk(net, 'PC', 170, 420, 'PC-2'); lk(net, 'PC-2', 'eth0', 'SW', G + 3); hd(net, 'PC-2').cfg.dhcp = true; },
      goals: [
        { t: 'Das Paket <code>isc-dhcp-server</code> ist installiert', c: n => hd(n, 'DHCP-01').lx.pkgs.includes('isc-dhcp-server') },
        { t: '<code>/etc/dhcp/dhcpd.conf</code> hat ein subnet mit range 10.0.0.100 bis 10.0.0.150 und Gateway 10.0.0.1', c: n => { const t = LXN.readFile(hd(n, 'DHCP-01').lx, '/etc/dhcp/dhcpd.conf') || '', c = t.split('\n').filter(l => !l.trim().startsWith('#')).join('\n'); return /subnet\s+10\.0\.0\.0\s+netmask\s+255\.255\.255\.0/.test(c) && /range\s+10\.0\.0\.100\s+10\.0\.0\.150\s*;/.test(c) && /option\s+routers\s+10\.0\.0\.1\s*;/.test(c); } },
        { t: 'Der Dienst läuft', c: n => !!hd(n, 'DHCP-01').svc.dhcp.on },
        { t: 'PC-2 hat per DHCP eine Adresse aus dem Pool', c: n => { const p = hd(n, 'PC-2'); return !!p.cfg.ip && NL.ip2n(p.cfg.ip) >= NL.ip2n('10.0.0.100') && NL.ip2n(p.cfg.ip) <= NL.ip2n('10.0.0.150'); } }],
      hints: ['<code>sudo apt install isc-dhcp-server</code>. Der Start direkt nach der Installation scheitert: Die Konfiguration ist noch leer, das ist normal.', 'Die Datei besteht aus einem Block: <code>subnet 10.0.0.0 netmask 255.255.255.0 { … }</code> mit den Zeilen <code>range 10.0.0.100 10.0.0.150;</code> und <code>option routers 10.0.0.1;</code>. Schreibe sie zeilenweise mit <code>echo "…" | sudo tee -a /etc/dhcp/dhcpd.conf</code>.', 'Danach <code>sudo systemctl restart isc-dhcp-server</code> und auf PC-2 <code>ipconfig /renew</code>.'],
      sol(net) { lxr(net, 'DHCP-01', ['sudo apt install isc-dhcp-server', 'echo "subnet 10.0.0.0 netmask 255.255.255.0 {" | sudo tee /etc/dhcp/dhcpd.conf', 'echo "  range 10.0.0.100 10.0.0.150;" | sudo tee -a /etc/dhcp/dhcpd.conf', 'echo "  option routers 10.0.0.1;" | sudo tee -a /etc/dhcp/dhcpd.conf', 'echo "}" | sudo tee -a /etc/dhcp/dhcpd.conf', 'sudo systemctl restart isc-dhcp-server']); hostLine(hd(net, 'PC-2'), NL.newSess(), 'ipconfig /renew'); } },
    { id: 'sc-lx-ufw', kind: 'Fehlersuche', title: 'Linux: Firewall blockt den Webserver', est: '8 min',
      intro: 'nginx läuft auf WEB-01, trotzdem lädt <code>http://10.0.0.10</code> auf PC-1 nicht. Ein Kollege hat die Host-Firewall <code>ufw</code> aktiviert und nur SSH freigegeben. Gib den Webport frei, ohne SSH zu sperren.',

      goals: [
        { t: 'nginx läuft', c: n => !!hd(n, 'WEB-01').svc.http.on },
        { t: 'ufw ist weiterhin aktiv', c: n => !!hd(n, 'WEB-01').lx.ufw.on },
        { t: 'SSH (Port 22) bleibt erlaubt', c: n => hd(n, 'WEB-01').lx.ufw.allow.includes('22') },
        { t: 'Port 80 ist freigegeben', c: n => hd(n, 'WEB-01').lx.ufw.allow.includes('80') },
        { t: 'PC-1 lädt <code>http://10.0.0.10</code>', c: n => { const d = hd(n, 'PC-1'); return !!d && !!httpGet(d, 'http://10.0.0.10').ok; } }],
      hints: ['<code>sudo ufw status</code> zeigt die Regeln. Der Dienst läuft, also liegt das Problem davor.', 'Mit <code>sudo ufw allow 80</code> gibst du den Webport frei. <code>ufw disable</code> wäre die falsche Abkürzung: Die Firewall soll an bleiben.'],
      sol(net) { lxr(net, 'WEB-01', 'sudo ufw allow 80'); } }

    // ---- System Engineer: Storage ----
    { id: 'sc-st-lun', kind: 'Aufbau', title: 'Storage: LUN für den Datenbankserver', est: '25 min',
      intro: 'SRV-DB (Ubuntu, 2× FC-HBA) soll 200 GB Speicher auf dem Storage STO-01 bekommen. Verkabelung und Netz stehen. Lege auf STO-01 einen RAID-Pool und die LUN <code>DB01</code> an, gib sie SRV-DB frei, richte auf MDS-A das Zoning ein und binde die LUN auf SRV-DB mit Multipath unter <code>/data</code> ein.',
      build(net) { stBase(net, ['SRV-DB']); },
      goals: [
        { t: 'STO-01 hat einen Pool mit RAID 5 oder RAID 6 und mindestens 1000 GB nutzbar', c: n => { const t = hd(n, 'STO-01'); return STORN.st(t).pools.some(p => ['raid5', 'raid6'].includes(p.raid) && STORN.poolInfo(t, p).usable >= 1000); } },
        { t: 'Die LUN <code>DB01</code> (mindestens 200 GB) liegt im Pool', c: n => STORN.st(hd(n, 'STO-01')).luns.some(l => l.name === 'DB01' && l.gb >= 200) },
        { t: 'DB01 ist für SRV-DB freigegeben (LUN-Masking)', c: n => STORN.st(hd(n, 'STO-01')).luns.some(l => l.name === 'DB01' && l.hosts.includes(hd(n, 'SRV-DB').id)) },
        { t: 'Das Zoneset auf MDS-A ist aktiv, SRV-DB erreicht den Storage über 4 Pfade', c: n => STORN.paths(n, hd(n, 'SRV-DB')).length === 4 },
        { t: 'SRV-DB hat die LUN gescannt und <code>multipath-tools</code> installiert', c: n => { const L = hd(n, 'SRV-DB').lx; return L.scsi.length === 1 && L.pkgs.includes('multipath-tools'); } },
        { t: 'Das Multipath-Gerät ist mit einem Dateisystem unter <code>/data</code> eingebunden', c: n => { const L = hd(n, 'SRV-DB').lx; return L.mounts['/data'] === '/dev/mapper/mpatha' && !!L.fmt['/dev/mapper/mpatha']; } }],
      hints: ['Klicke STO-01 an und öffne das Web-GUI (Storage-Manager) → „Speicherpools“ und „LUNs“. Ein Pool aus 6× 600 GB mit RAID 5 liefert 3000 GB nutzbar. Danach unter „LUNs“ → „Zuordnen“ den Server auswählen.', 'Ohne Zoning sieht der Server nichts: Web-GUI von MDS-A (Fabric-Manager) → „Zoning“ → „Auto-Zoning aus Verkabelung“ → „Zoneset aktivieren“. Der Server hat zwei HBA-Ports und der Storage zwei Controller, deshalb entstehen 4 Pfade.', 'Terminal von SRV-DB: <code>sudo rescan-scsi-bus.sh</code>, dann <code>lsblk</code>. Dieselbe LUN taucht viermal auf, bis <code>sudo apt install multipath-tools</code> sie zu <code>mpatha</code> zusammenfasst. Danach <code>sudo mkdir /data</code>, <code>sudo mkfs.ext4 /dev/mapper/mpatha</code>, <code>sudo mount /dev/mapper/mpatha /data</code>.'],
      sol(net) { const t = hd(net, 'STO-01'), srv = hd(net, 'SRV-DB'), m = hd(net, 'MDS-A'); STORN.createPool(t, { name: 'POOL1', raid: 'raid5', disks: 6, diskGb: 600 }); STORN.createLun(t, { name: 'DB01', pool: 'POOL1', gb: 200 }); STORN.maskLun(t, 0, srv.id, true); STORN.autoZones(net, m); STORN.zoneActive(m, true); lxr(net, 'SRV-DB', ['sudo rescan-scsi-bus.sh', 'sudo apt install multipath-tools', 'sudo rescan-scsi-bus.sh', 'sudo mkdir /data', 'sudo mkfs.ext4 /dev/mapper/mpatha', 'sudo mount /dev/mapper/mpatha /data']); } },
    { id: 'sc-st-zone', kind: 'Fehlersuche', title: 'Storage: Server sieht die LUN nicht', est: '15 min',
      intro: 'Die LUN <code>APP01</code> auf STO-01 soll SRV-APP bekommen, aber <code>lsblk</code> zeigt dort keine neue Platte. Verkabelung, Pool und LUN sind in Ordnung. Es stecken drei Fehler in Masking, Zoning und Betriebssystem.',
      build(net) { stBase(net, ['SRV-APP', 'SRV-DB']); const t = hd(net, 'STO-01'), a = hd(net, 'SRV-APP'), db = hd(net, 'SRV-DB'), m = hd(net, 'MDS-A'); STORN.createPool(t, { name: 'POOL1', raid: 'raid5', disks: 6, diskGb: 600 }); STORN.createLun(t, { name: 'APP01', pool: 'POOL1', gb: 100 }); STORN.maskLun(t, 0, db.id, true); STORN.autoZones(net, m); void a; },
      goals: [
        { t: 'APP01 ist für SRV-APP freigegeben (LUN-Masking)', c: n => STORN.st(hd(n, 'STO-01')).luns.some(l => l.name === 'APP01' && l.hosts.includes(hd(n, 'SRV-APP').id)) },
        { t: 'APP01 ist <b>nicht</b> für SRV-DB freigegeben', c: n => STORN.st(hd(n, 'STO-01')).luns.some(l => l.name === 'APP01' && !l.hosts.includes(hd(n, 'SRV-DB').id)) },
        { t: 'Das Zoneset auf MDS-A ist aktiv', c: n => !!STORN.zs(hd(n, 'MDS-A')).active },
        { t: 'SRV-APP erreicht APP01 über mindestens 2 Pfade', c: n => STORN.hostLuns(n, hd(n, 'SRV-APP')).some(x => x.name === 'APP01' && x.paths.length >= 2) },
        { t: 'SRV-APP hat neu gescannt und sieht die Platte (<code>lsblk</code>)', c: n => hd(n, 'SRV-APP').lx.scsi.length > 0 }],
      hints: ['Web-GUI von STO-01 → „Hosts und Zugriff“: Dort steht pro Server, ob er die LUN sieht und wenn nicht, warum. Die Freigabe geht an den falschen Server (LUNs → Zuordnen).', 'Zonen allein reichen nicht: Web-GUI von MDS-A → „Zoning“. Es gibt Zonen, aber das Zoneset ist nicht aktiv (ohne aktives Zoneset gilt deny).', 'Neue LUNs erscheinen im Betriebssystem erst nach einem Rescan: <code>sudo rescan-scsi-bus.sh</code>.'],
      sol(net) { const t = hd(net, 'STO-01'); STORN.maskLun(t, 0, hd(net, 'SRV-DB').id, false); STORN.maskLun(t, 0, hd(net, 'SRV-APP').id, true); STORN.zoneActive(hd(net, 'MDS-A'), true); lxr(net, 'SRV-APP', 'sudo rescan-scsi-bus.sh'); } },
    { id: 'sc-st-raid', kind: 'Aufbau', title: 'Storage: RAID-Pool dimensionieren', est: '10 min',
      intro: 'Das Archiv braucht <b>mindestens 5000 GB nutzbaren Speicher</b> und muss <b>zwei gleichzeitige Plattenausfälle</b> überstehen. Verfügbar sind höchstens 12 Platten mit je 600 GB im STO-01. Wähle den passenden RAID-Level und lege die LUN <code>ARCHIV</code> mit 4800 GB an.',
      build(net) { mk(net, 'HW-Dorado-5000V6', 400, 220, 'STO-01'); },
      goals: [
        { t: 'Es gibt einen Pool, der zwei Plattenausfälle übersteht (RAID 6)', c: n => STORN.st(hd(n, 'STO-01')).pools.some(p => STORN.RAID[p.raid].fault >= 2) },
        { t: 'Der Pool nutzt höchstens 12 Platten à 600 GB und bietet mindestens 5000 GB', c: n => { const t = hd(n, 'STO-01'); return STORN.st(t).pools.some(p => p.diskGb === 600 && p.disks <= 12 && STORN.poolInfo(t, p).usable >= 5000); } },
        { t: 'Die LUN <code>ARCHIV</code> (4800 GB, Thick) liegt im Pool', c: n => STORN.st(hd(n, 'STO-01')).luns.some(l => l.name === 'ARCHIV' && l.gb === 4800 && !l.thin) }],
      hints: ['RAID 5 verträgt nur eine Platte, RAID 10 liefert nur die Hälfte (12× 600 GB = 3600 GB), RAID 6 verliert zwei Platten an Parität: (12 − 2) × 600 = 6000 GB.', 'Web-GUI von STO-01 → „Speicherpools“ → Pool mit RAID 6, 12 Platten, 600 GB, dann „LUNs“ → LUN erstellen.'],
      sol(net) { const t = hd(net, 'STO-01'); STORN.createPool(t, { name: 'ARCHIV-POOL', raid: 'raid6', disks: 12, diskGb: 600 }); STORN.createLun(t, { name: 'ARCHIV', pool: 'ARCHIV-POOL', gb: 4800 }); } },
    { id: 'sc-st-mpath', kind: 'Fehlersuche', title: 'Storage: Pfade fehlen', est: '15 min',

    { id: 'sc-win-ad', kind: 'Aufbau', title: 'Windows: Active Directory aufbauen', est: '25 min',
      intro: 'DC01 ist ein frischer Windows Server 2022 mit fester IP-Adresse. Baue die Domäne <code>lab.local</code> auf: Rolle installieren, Gesamtstruktur anlegen, die Organisationseinheit <code>Sales</code>, die Benutzer <code>mmuster</code> und <code>abeispiel</code> in der Gruppe <code>Vertrieb</code> – und nimm PC-1 in die Domäne auf. Öffne dazu das Terminal von DC01 (PowerShell) und von PC-1.',
      build(net) { winBase(net, [['DC01', '10.0.0.10']]); },

        { t: 'DC01 ist Domänencontroller der Gesamtstruktur <code>lab.local</code>', c: n => { const w = hd(n, 'DC01').win; return !!w && !!w.domain && w.domain.role === 'dc' && w.domain.name === 'lab.local'; } },
        { t: 'Die Organisationseinheit <code>Sales</code> existiert', c: n => { const w = hd(n, 'DC01').win; return !!w && !!w.ad && w.ad.ous.includes('Sales'); } },
        { t: 'Die Benutzer <code>mmuster</code> und <code>abeispiel</code> sind angelegt und aktiviert', c: n => { const w = hd(n, 'DC01').win, u = w && w.ad ? w.ad.users : []; return ['mmuster', 'abeispiel'].every(s => u.some(x => x.sam === s && x.enabled)); } },
        { t: 'Die Gruppe <code>Vertrieb</code> (Global) enthält beide Benutzer', c: n => { const w = hd(n, 'DC01').win, g = w && w.ad && w.ad.groups.find(x => x.name === 'Vertrieb'); return !!g && ['mmuster', 'abeispiel'].every(s => g.members.includes(s)); } },
        { t: 'PC-1 nutzt DC01 als DNS-Server (<code>10.0.0.10</code>)', c: n => hd(n, 'PC-1').cfg.dns === '10.0.0.10' },
        { t: 'PC-1 ist Mitglied der Domäne <code>lab.local</code>', c: n => { const w = hd(n, 'PC-1').win; return !!w && !!w.domain && w.domain.name === 'lab.local'; } }],
      hints: ['Auf DC01: <code>Install-WindowsFeature -Name AD-Domain-Services -IncludeManagementTools</code>, dann <code>Install-ADDSForest -DomainName lab.local -SafeModeAdministratorPassword (ConvertTo-SecureString "P@ssw0rd123" -AsPlainText -Force) -Force</code>.', 'Benutzer: <code>New-ADUser -Name "Max Muster" -SamAccountName mmuster -AccountPassword (ConvertTo-SecureString "Sommer2026!" -AsPlainText -Force) -Enabled $true</code>. Das Kennwort muss komplex sein (Groß-/Kleinbuchstaben, Ziffer, Sonderzeichen). Gruppe: <code>New-ADGroup -Name Vertrieb -GroupScope Global</code>, <code>Add-ADGroupMember -Identity Vertrieb -Members mmuster,abeispiel</code>.', 'Auf PC-1: erst <code>Set-DnsClientServerAddress -InterfaceAlias Ethernet0 -ServerAddresses 10.0.0.10</code> (der Client findet die Domäne über DNS), dann <code>Add-Computer -DomainName lab.local -Credential lab\\administrator</code>.'],

    { id: 'sc-win-join', kind: 'Fehlersuche', title: 'Windows: Domänenbeitritt schlägt fehl', est: '15 min',
      intro: 'Die Domäne <code>lab.local</code> steht auf DC01. PC-1 meldet beim Beitritt: „Die angegebene Domäne ist nicht vorhanden oder konnte nicht kontaktiert werden.“ Netz und Kabel sind in Ordnung. Es sind drei Fehler eingebaut, die der Reihe nach auftreten.',
      build(net) { winBase(net, [['DC01', '10.0.0.10']]); dcSetup(net, true); hd(net, 'PC-1').cfg.dns = '10.0.0.1'; wxr(net, 'DC01', ['Stop-Service DNS', 'Stop-Service NTDS']); },

      hints: ['Die Fehlermeldung enthält einen <code>[Hinweis]</code> mit der Ursache. Der erste: DNS auf PC-1 zeigt nicht auf den DC. <code>ipconfig /all</code> zeigt den DNS-Server.', 'Danach liegt es am DC: <code>Get-Service DNS, NTDS</code> auf DC01 zeigt „Stopped“. Starten mit <code>Start-Service DNS</code>.', 'Zum Schluss <code>Add-Computer -DomainName lab.local -Credential lab\\administrator</code>.'],

    { id: 'sc-win-dhcp', kind: 'Fehlersuche', title: 'Windows: DHCP vergibt keine Adressen', est: '15 min',
      intro: 'FS01 (Domänenmitglied) ist als DHCP-Server eingerichtet, aber PC-2 bekommt per <code>ipconfig /renew</code> keine Adresse. Rolle und Bereich sind angelegt. Finde die drei Ursachen: der Dienst, die Autorisierung in Active Directory und der Adressbereich.',
      build(net) { winBase(net, [['DC01', '10.0.0.10'], ['FS01', '10.0.0.30']], { pc2: true }); dcSetup(net, false); joinDomain(net, 'FS01'); wxr(net, 'FS01', ['Install-WindowsFeature DHCP', 'Add-DhcpServerv4Scope -Name LAN -StartRange 10.0.1.100 -EndRange 10.0.1.150 -SubnetMask 255.255.255.0', 'Set-DhcpServerv4OptionValue -Router 10.0.0.1 -DnsServer 10.0.0.10']); },
      goals: [
        { t: 'Der Dienst DHCPServer auf FS01 läuft', c: n => hd(n, 'FS01').win.svc.DHCPServer === 'Running' },
        { t: 'FS01 ist in Active Directory als DHCP-Server autorisiert', c: n => !!hd(n, 'FS01').win.dhcp.auth },
        { t: 'Der Bereich liegt im Netz des Servers (<code>10.0.0.100</code> bis <code>10.0.0.150</code>)', c: n => { const s = hd(n, 'FS01').win.dhcp.scope; return !!s && s.start === '10.0.0.100' && s.end === '10.0.0.150'; } },
        { t: 'PC-2 hat per DHCP eine Adresse aus dem Bereich', c: n => { const p = hd(n, 'PC-2'); return !!p.cfg.ip && NL.ip2n(p.cfg.ip) >= NL.ip2n('10.0.0.100') && NL.ip2n(p.cfg.ip) <= NL.ip2n('10.0.0.150'); } }],
      hints: ['<code>Get-Service DHCPServer</code> auf FS01: Der Dienst steht auf „Stopped“. Und <code>Get-DhcpServerv4Scope</code> zeigt den Bereich.', 'In einer Domäne darf ein DHCP-Server erst Adressen vergeben, wenn er autorisiert ist: <code>Add-DhcpServerInDC</code>. Das verhindert Schwarzbetrieb durch fremde DHCP-Server.', 'Der Bereich liegt in <code>10.0.1.0</code>, der Server hat <code>10.0.0.30</code>: <code>Remove-DhcpServerv4Scope</code>, dann neu mit <code>Add-DhcpServerv4Scope</code> und die Optionen setzen. Danach auf PC-2 <code>ipconfig /renew</code>.'],
      sol(net) { wxr(net, 'FS01', ['Remove-DhcpServerv4Scope', 'Add-DhcpServerv4Scope -Name LAN -StartRange 10.0.0.100 -EndRange 10.0.0.150 -SubnetMask 255.255.255.0', 'Set-DhcpServerv4OptionValue -Router 10.0.0.1 -DnsServer 10.0.0.10', 'Add-DhcpServerInDC', 'Start-Service DHCPServer']); hostLine(hd(net, 'PC-2'), NL.newSess(), 'ipconfig /renew'); } },
    { id: 'sc-win-iis', kind: 'Fehlersuche', title: 'Windows: IIS-Seite nicht erreichbar', est: '12 min',

        { t: 'Der Dienst W3SVC (IIS) läuft', c: n => hd(n, 'WEB01').win.svc.W3SVC === 'Running' },

        { t: 'Auf der Startseite steht der Titel „Intranet“', c: n => { const f = hd(n, 'WEB01').win.files['C:\\inetpub\\wwwroot\\index.html']; return !!f && /<title>Intranet<\/title>/i.test(f.t); } },
        { t: 'PC-1 lädt <code>http://10.0.0.30</code>', c: n => { const d = hd(n, 'PC-1'); return !!d && !!httpGet(d, 'http://10.0.0.30').ok; } }],
      hints: ['<code>Get-Service W3SVC</code> zeigt „Stopped“. <code>Start-Service W3SVC</code>.', 'Die Windows-Firewall blockt Port 80: <code>Get-NetFirewallRule</code> zeigt die Regel mit Enabled False. <code>Enable-NetFirewallRule -DisplayName "World Wide Web Services (HTTP Traffic-In)"</code>.', 'Die Startseite fehlt: <code>Set-Content -Path C:\\inetpub\\wwwroot\\index.html -Value "&lt;html&gt;&lt;head&gt;&lt;title&gt;Intranet&lt;/title&gt;&lt;/head&gt;&lt;body&gt;Willkommen&lt;/body&gt;&lt;/html&gt;"</code>.'],
      sol(net) { wxr(net, 'WEB01', ['Start-Service W3SVC', 'Enable-NetFirewallRule -DisplayName "World Wide Web Services (HTTP Traffic-In)"', 'Set-Content -Path C:\\inetpub\\wwwroot\\index.html -Value "<html><head><title>Intranet</title></head><body>Willkommen</body></html>"']); } },
    { id: 'sc-win-share', kind: 'Aufbau', title: 'Windows: Dateiserver mit Freigabe', est: '15 min',
      intro: 'FS01 ist Domänenmitglied. Die Abteilung Vertrieb braucht die Freigabe <code>Daten</code> auf <code>D:\\Daten</code>. Installiere die Rolle Dateiserver, lege den Ordner an und gib ihn der Gruppe <code>LAB\\Vertrieb</code> mit Vollzugriff frei (nicht „Jeder“).',
      build(net) { winBase(net, [['DC01', '10.0.0.10'], ['FS01', '10.0.0.30']]); dcSetup(net, true); joinDomain(net, 'FS01'); },
      goals: [
        { t: 'Die Rolle <code>FS-FileServer</code> ist installiert', c: n => !!hd(n, 'FS01').win.feats['FS-FileServer'] },
        { t: 'Der Ordner <code>D:\\Daten</code> existiert', c: n => !!hd(n, 'FS01').win.files['D:\\Daten'] },
        { t: 'Die Freigabe <code>Daten</code> zeigt auf <code>D:\\Daten</code>', c: n => hd(n, 'FS01').win.shares.some(s => s.name === 'Daten' && s.path === 'D:\\Daten') },
        { t: 'Nur die Gruppe <code>LAB\\Vertrieb</code> hat Vollzugriff', c: n => hd(n, 'FS01').win.shares.some(s => s.name === 'Daten' && s.full.length === 1 && /vertrieb$/i.test(s.full[0])) }],
      hints: ['<code>Install-WindowsFeature FS-FileServer</code>, <code>New-Item -ItemType Directory -Path D:\\Daten</code>.', '<code>New-SmbShare -Name Daten -Path D:\\Daten -FullAccess LAB\\Vertrieb</code>. Die Gruppe muss in AD existieren, sonst meldet Windows „Keine Zuordnung zwischen Kontonamen und Sicherheits-IDs“.', 'Besser als „Jeder“: Berechtigungen immer an Gruppen vergeben, nie an einzelne Benutzer (AGDLP-Prinzip).'],
      sol(net) { wxr(net, 'FS01', ['Install-WindowsFeature FS-FileServer', 'New-Item -ItemType Directory -Path D:\\Daten', 'New-SmbShare -Name Daten -Path D:\\Daten -FullAccess LAB\\Vertrieb']); } }
    ,
    // ---- System Engineer: Virtualisierung ----
    { id: 'sc-vm-net', kind: 'Fehlersuche', title: 'Virtualisierung: VM erreicht das Netz nicht', est: '15 min',
      intro: 'Auf dem Hypervisor HV1 läuft die VM <code>WEB-VM</code> im VLAN 20 (<code>10.20.0.10/24</code>). PC-20 im selben VLAN erreicht sie nicht, und die VM erreicht nicht einmal ihr Gateway. Das Kabel des Hosts hängt am Switch. Es sind drei Fehler eingebaut: im vSwitch des Hosts und am Switchport.',
      build(net) {
        mk(net, 'C9200L-24P-4X', 420, 60, 'SW'); mk(net, 'HW-2288H-V5', 200, 330, 'HV1'); mk(net, 'PC', 640, 330, 'PC-20'); lk(net, 'HV1', 'eth1', 'SW', G + 1); lk(net, 'PC-20', 'eth0', 'SW', G + 3);
        rn(net, 'SW', ['vlan 10', 'vlan 20', 'interface g1/0/1', 'switchport mode access', 'switchport access vlan 10', 'interface g1/0/3', 'switchport mode access', 'switchport access vlan 20', 'ip routing', 'interface vlan 20', 'ip address 10.20.0.1 255.255.255.0', 'no shutdown']);
        rn(net, 'PC-20', ['ip 10.20.0.50/24 10.20.0.1']); const h = hd(net, 'HV1'); VIRTN.enable(net, h); VIRTN.setUplink(h, 'eth1', false);
        const r = VIRTN.createVm(net, h, { name: 'WEB-VM', cpu: 2, ramGb: 8, diskGb: 40, vlan: 20 }, defSvc); rn(net, 'WEB-VM', ['ip 10.20.0.10/24 10.20.0.1']); VIRTN.start(net, net.devs[r.id]); },
      goals: [
        { t: 'Der Port <code>eth1</code> ist Uplink des vSwitch von HV1 (dort steckt das Kabel)', c: n => hd(n, 'HV1').vsw.uplinks.includes('eth1') },
        { t: 'Der Switchport Gi1/0/1 ist ein Trunk, der VLAN 20 durchlässt', c: n => { const i = hd(n, 'SW').cfg.ifs[G + 1], a = i.allowed; return i.mode === 'trunk' && (a === null || a.includes(20)); } },
        { t: 'WEB-VM erreicht das Gateway <code>10.20.0.1</code>', c: n => pg(n, 'WEB-VM', '10.20.0.1') },
        { t: 'PC-20 erreicht WEB-VM', c: n => pg(n, 'PC-20', '10.20.0.10') }],
      hints: ['Web-GUI von HV1 (Virtualisierungs-Manager) → „Virtueller Switch“. Der vSwitch nutzt nur die Uplinks, die aktiviert sind. Das Kabel steckt in <code>eth1</code>.', 'Der Ping-Debugger sagt es danach direkt: Die VM sendet Frames mit VLAN-Tag 20. Ein Access-Port nimmt keine getaggten Frames an – der Port zum Host muss ein Trunk sein: <code>interface g1/0/1</code>, <code>switchport mode trunk</code>.', 'Beim Trunk die erlaubten VLANs prüfen: <code>switchport trunk allowed vlan 10,20</code>.'],
      sol(net) { VIRTN.setUplink(hd(net, 'HV1'), 'eth1', true); rn(net, 'SW', ['interface g1/0/1', 'switchport mode trunk', 'switchport trunk allowed vlan 10,20']); } },
    { id: 'sc-vm-capacity', kind: 'Aufbau', title: 'Virtualisierung: VMs auf zwei Hosts verteilen', est: '15 min',
      intro: 'HV1 hat 256 GB RAM und trägt schon drei VMs mit je 80 GB (240 GB). Die neue VM <code>NEW-APP</code> braucht 32 GB und lässt sich nicht starten. Du darfst keine VM löschen und keine ausgeschaltet lassen. HV2 hat viel Platz. Bilde einen Cluster und verschiebe eine VM (die VMs liegen auf lokalen Platten, also nur kalt).',
      build(net) { mk(net, 'C9200L-24P-4X', 420, 60, 'SW'); mk(net, 'HW-1288H-V5', 200, 330, 'HV1'); mk(net, 'HW-1288H-V5', 700, 330, 'HV2'); lk(net, 'HV1', 'eth0', 'SW', G + 1); lk(net, 'HV2', 'eth0', 'SW', G + 2);
        const h1 = hd(net, 'HV1'), h2 = hd(net, 'HV2'); VIRTN.enable(net, h1); VIRTN.enable(net, h2);
        ['APP-1', 'APP-2', 'APP-3'].forEach(n => { const r = VIRTN.createVm(net, h1, { name: n, cpu: 4, ramGb: 80, diskGb: 100 }, defSvc); VIRTN.start(net, net.devs[r.id]); }); VIRTN.createVm(net, h1, { name: 'NEW-APP', cpu: 4, ramGb: 32, diskGb: 100 }, defSvc); },
      goals: [
        { t: 'HV1 und HV2 gehören zum selben Cluster', c: n => { const a = hd(n, 'HV1').hv.cluster, b = hd(n, 'HV2').hv.cluster; return !!a && a === b; } },
        { t: 'Es gibt weiterhin vier VMs (keine gelöscht)', c: n => Object.values(n.devs).filter(d => d.vm).length === 4 },
        { t: 'NEW-APP läuft', c: n => hd(n, 'NEW-APP').vm.state === 'running' },
        { t: 'Alle vier VMs laufen, und HV1 überschreitet seine 256 GB nicht', c: n => Object.values(n.devs).filter(d => d.vm).every(d => d.vm.state === 'running') && VIRTN.usedRam(n, hd(n, 'HV1').id) <= 256 }],
      hints: ['Die Fehlermeldung beim Start nennt, wie viel RAM frei ist. Auf HV1 sind es nur 16 GB.', 'Web-GUI von HV1 → „Cluster und HA“ → Cluster-Name z. B. <code>CL1</code> eintragen, dasselbe bei HV2. Ohne Cluster lässt sich keine VM verschieben.', 'Eine VM liegt auf der lokalen Platte: erst ausschalten, dann in „Virtuelle Maschinen“ → „Verschieben“, dann wieder einschalten. Danach NEW-APP starten.'],
      sol(net) { const h1 = hd(net, 'HV1'), h2 = hd(net, 'HV2'); h1.hv.cluster = 'CL1'; h2.hv.cluster = 'CL1'; const v = hd(net, 'APP-3'); VIRTN.stop(net, v); VIRTN.migrate(net, v, h2.id); VIRTN.start(net, v); VIRTN.start(net, hd(net, 'NEW-APP')); } },
    { id: 'sc-vm-migrate', kind: 'Aufbau', title: 'Virtualisierung: Live-Migration über SAN-Datastore', est: '20 min',
      intro: 'Die VMs <code>WEB-VM</code> und <code>DB-VM</code> laufen auf HV1 und liegen auf dem SAN-Datastore <code>DS01</code>. HV1 soll gewartet werden: Verschiebe beide VMs live auf HV2, ohne sie auszuschalten. Dafür muss HV2 den Datastore sehen.',
      build(net) { vmSan(net, { onlyFirst: true }); },
      goals: [
        { t: 'Die LUN <code>DS01</code> ist auch für HV2 freigegeben (Masking)', c: n => { const t = hd(n, 'STO-01'); return STORN.st(t).luns.some(l => l.name === 'DS01' && l.hosts.includes(hd(n, 'HV1').id) && l.hosts.includes(hd(n, 'HV2').id)); } },
        { t: 'HV2 sieht den Datastore (<code>DS01</code>)', c: n => VIRTN.datastores(n, hd(n, 'HV2')).some(x => x.name === 'DS01') },
        { t: 'WEB-VM und DB-VM laufen auf HV2', c: n => ['WEB-VM', 'DB-VM'].every(v => hd(n, v).vm.host === hd(n, 'HV2').id && hd(n, v).vm.state === 'running') },
        { t: 'Beide VMs antworten auf Ping von R-GW', c: n => pg(n, 'R-GW', '10.0.0.60') && pg(n, 'R-GW', '10.0.0.61') }],
      hints: ['Der Versuch zu verschieben meldet: Der Datastore ist auf HV2 nicht sichtbar. Das ist ein SAN-Problem: Web-GUI von STO-01 → „LUNs“ → bei DS01 „Zuordnen“ und auch HV2 ankreuzen (Masking).', 'Danach im Virtualisierungs-Manager von HV1 → „Virtuelle Maschinen“ → „Verschieben“ (beide Hosts sind schon im Cluster CL1). Eine laufende VM wandert nur mit gemeinsamem Datastore.', 'Zum Schluss prüfen, ob die VMs noch antworten: Sie bleiben im selben VLAN, der Uplink von HV2 führt in dasselbe Netz.'],
      sol(net) { STORN.maskLun(hd(net, 'STO-01'), 0, hd(net, 'HV2').id, true); ['WEB-VM', 'DB-VM'].forEach(v => VIRTN.migrate(net, hd(net, v), hd(net, 'HV2').id)); } },

<script>

  }
  function complete(inp) {

  function openDev(id, quiet) {

  function refresh() {

  }
  function linkKind(net, l) {

    const tr = (d, p) => (d.type === 'switch' && d.cfg.ifs[p].mode === 'trunk') || (d.type === 'router' && Object.keys(d.cfg.ifs).some(n => n.startsWith(p + '.')));

  const ICON = {

      <h2 class="wk-sub">Gut zum Einstieg</h2><ul class="wk-list">${START.map(WIKI.get).filter(Boolean).map(wkRow).join('')}</ul>`;
    const catPage = c => { const l = WIKI.byCat(c.id), a = l.filter(x => !x.gen), g = l.filter(x => x.gen); return `<p class="wk-crumb"><a href="#wiki">Wiki</a></p><h1>${esc(c.name)}</h1><p class="wk-lead">${esc(c.desc)}</p><ul class="wk-list">${a.map(wkRow).join('')}</ul>${g.length ? `<h2 class="wk-sub">Aus dem Planer (${g.length})</h2><ul class="wk-list">${g.map(wkRow).join('')}</ul>` : ''}`; };
    const artPage = a => { const c = cats.find(x => x.id === a.cat); document.title = a.title + ' – Wiki – NetLab'; const rel = (a.rel || []).map(wkLink).join(''); return `<p class="wk-crumb"><a href="#wiki">Wiki</a> › <a href="#wiki/k/${c.id}">${esc(c.name)}</a></p><h1>${esc(a.title)}</h1><p class="wk-lead">${esc(a.short)}</p><div class="wk-body">${WIKI.links(a.body)}</div>${rel ? `<div class="wk-rel"><h2>Siehe auch</h2><div class="wk-chips">${rel}</div></div>` : ''}`; };
    const show = () => { main.innerHTML = cat ? catPage(cat) : art ? artPage(art) : arg ? `<h1>Artikel nicht gefunden</h1><p class="wk-lead">Den Artikel „${esc(arg)}“ gibt es nicht. Suche oben oder wähle eine Kategorie.</p>` : home(); };
    const results = v => { const r = WIKI.search(v); main.innerHTML = `<p class="wk-crumb"><a href="#wiki">Wiki</a></p><h1>Suche: „${esc(v)}“</h1>` + (r.length ? `<p class="wk-lead">${r.length} Treffer</p><ul class="wk-list">${r.slice(0, 40).map(wkRow).join('')}</ul>` : '<p class="wk-lead">Keine Treffer. Probiere einen Oberbegriff wie „VLAN“, „Kabel“ oder „Zoning“.</p>'); };
    show();
    q.addEventListener('input', () => { const v = q.value.trim(); if (v) results(v); else show(); });
    q.addEventListener('keydown', e => { if (e.key === 'Enter') { const r = WIKI.search(q.value); if (r[0]) { q.value = ''; location.hash = '#wiki/' + r[0].id; } } else if (e.key === 'Escape') { q.value = ''; show(); q.blur(); } });
    document.addEventListener('keydown', function k(e) { if (!$('#wq')) { document.removeEventListener('keydown', k); return; } if (e.key === '/' && !/^(INPUT|TEXTAREA|SELECT)$/.test((e.target || {}).tagName || '')) { e.preventDefault(); $('#wq').focus(); } });
  }

  // ---------------- Router ----------------
  function route() {
    const onSbx = location.hash === '#sandbox';
    const onWiki = /^#wiki/.test(location.hash);
    $('#nav-labs').setAttribute('aria-current', onSbx || onWiki ? 'false' : 'page'); $('#nav-sbx').setAttribute('aria-current', onSbx ? 'page' : 'false'); $('#nav-wiki').setAttribute('aria-current', onWiki ? 'page' : 'false');
    if (onSbx) { cur = null; window.scrollTo(0, 0); return Sandbox.open(app); }
    Sandbox.close();
    if (onWiki) { cur = null; window.scrollTo(0, 0); return wikiView(location.hash.replace(/^#wiki\/?/, '')); }
    const m = location.hash.match(/^#lab\/([\w-]+)/); const lab = m && ALL.find(l => l.id === m[1]);
    window.scrollTo(0, 0);
    if (!lab) return home();
    ({ cli: openCli, ise: openIse, ssl: openSsl, subnet: openSubnet, quiz: openQuiz })[lab.type](lab);
  }
  window.addEventListener('hashchange', route);
  leds(); route();
})();

</script>
