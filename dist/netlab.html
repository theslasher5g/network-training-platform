  function blockInfo(ctx, d) { const L = init(d); if (L.scsi === null) L.scsi = scanList(ctx, d); return devTable(L).map(x => ({ name: x.e.name, gb: x.e.gb, mp: x.mp, multipath: isMp(L), paths: x.paths.map(q => q.name), dev: isMp(L) ? '/dev/mapper/' + x.mp : '/dev/' + x.paths[0].name, fs: L.fmt[isMp(L) ? '/dev/mapper/' + x.mp : '/dev/' + x.paths[0].name] || '', mounts: Object.keys(L.mounts).filter(k => L.mounts[k] === (isMp(L) ? '/dev/mapper/' + x.mp : '/dev/' + x.paths[0].name)) })); }
  const diskUse = d => { const L = init(d); return { used: used(L), total: TOTAL, full: diskFull(L) }; };
  const logLines = (d, u, n) => init(d).log.filter(l => !u || l.u === u).slice(-(n || 20)).map(l => l.t);
  const ufwState = d => init(d).ufw;
  return { unitList, pkgList, saveFile, fileList, blockInfo, diskUse, logLines, ufwState, exec, prompt, init, isLinux, applyConf, startUnit, unitName, nginxCheck, readFile, writeFile, resolvePath, used, TOTAL, jl, diskFull };
})();
if (typeof module !== 'undefined') module.exports = LX;

</script>
<script>
// ===================== NetLab Wiki =====================
// Nachschlagewerk zu Kabeln, Ports, Geräten, Protokollen, Storage und Servern.
// Artikeltexte: einfaches HTML. Verweise: [[id]] oder [[id|Linktext]].
const WIKI = (function () {
  const N = typeof NL !== 'undefined' ? NL : require('./engine.js');
  const CATS = [
    { id: 'kabel', name: 'Kabel und Stecker', desc: 'Kupfer, Glasfaser, DAC und ihre Steckverbinder' },
    { id: 'ports', name: 'Ports und Transceiver', desc: 'SFP, QSFP, PoE, LEDs, Slots und Karten' },
    { id: 'geraete', name: 'Geräte', desc: 'Switches, Router, Firewalls, Server und Storage im Planer' },
    { id: 'l2', name: 'Layer 2: Switching', desc: 'VLAN, Trunk, STP, EtherChannel, Port-Sicherheit' },
    { id: 'l3', name: 'Layer 3: Netze und Dienste', desc: 'IP, Routing, NAT, DHCP, DNS' },
    { id: 'sec', name: 'Sicherheit', desc: 'ACL, Firewall, 802.1X, VPN, Härtung' },
    { id: 'storage', name: 'Storage und SAN', desc: 'Fibre Channel, Zoning, LUN, RAID, iSCSI, NVMe' },
    { id: 'server', name: 'Server und Betriebssysteme', desc: 'Linux, Dienste, Windows, Virtualisierung' },
    { id: 'ios', name: 'IOS-Befehle', desc: 'Spickzettel für die Cisco-CLI' },
    { id: 'glossar', name: 'Begriffe', desc: 'Kurz erklärt: von Bandbreite bis Zero Trust' }
  ];
  const A = [];
  const art = (id, cat, title, short, body, rel, extra) => A.push(Object.assign({ id, cat, title, short, body, rel: rel || [], tags: '' }, extra || {}));
  const tbl = (head, rows) => `<table class="wk"><thead><tr>${head.map(h => `<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.map(r => `<tr>${r.map(c => `<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
  const ul = items => `<ul>${items.map(i => `<li>${i}</li>`).join('')}</ul>`;
  const plan = t => `<p class="wk-plan"><b>Im Planer:</b> ${t}</p>`;

  // ---------------------------------------------------------------- Kabel
  art('kabel-uebersicht', 'kabel', 'Kabeltypen im Überblick', 'Welches Kabel für welche Strecke?',
    `<p>Der Planer kennt vier Kabeltypen. Das Medium bestimmt Reichweite, Geschwindigkeit und welche Transceiver passen.</p>` + tbl(['Typ', 'Medium', 'Typische Reichweite', 'Einsatz'], [
      ['[[kabel-cu|Kupfer Cat6]]', 'Twisted Pair, RJ45', 'bis 100 m', 'Clients, Access-Ports, PoE, Management'],
      ['[[kabel-mmf|Glasfaser OM3 (MM)]]', 'Multimode, 850 nm', '70 bis 400 m je nach Speed', 'Rechenzentrum, Core, SAN'],
      ['[[kabel-smf|Glasfaser OS2 (SM)]]', 'Singlemode, 1310/1550 nm', '10 km und mehr', 'Gebäude- und Standortverbindungen'],
      ['[[kabel-dac|DAC (passiv)]]', 'Twinax-Kupfer, fester Stecker', '1 bis 5 m', 'Server zum Top-of-Rack-Switch']]) +
    `<p>Faustregel: <b>kurz und billig = DAC</b>, <b>innerhalb des Gebäudes = Multimode</b>, <b>weit = Singlemode</b>, <b>Endgeräte = Kupfer</b>.</p>` + plan('Kabelfarben: Kupfer blau, Multimode türkis, Singlemode gelb, DAC violett. Unter „Kabel“ in der linken Leiste wählst du den Typ und klickst dann zwei freie Ports an.'),
    ['kabel-farben', 'transceiver-grundlagen']);
  art('kabel-cu', 'kabel', 'Kupferkabel (Twisted Pair, Cat5e/6/6a)', 'RJ45, vier verdrillte Paare, maximal 100 m.',
    `<p>Ein Kupferkabel besteht aus vier verdrillten Adernpaaren. Das Verdrillen unterdrückt Störungen. Der Stecker heißt [[stecker-rj45|RJ45]]. Die maximale Kanallänge beträgt <b>100 m</b> (90 m fest verlegt plus zweimal 5 m Patchkabel).</p>` + tbl(['Kategorie', 'Geschwindigkeit', 'Hinweis'], [['Cat5e', '1 Gbit/s', 'Standard für Gigabit, bis 100 m'], ['Cat6', '1 Gbit/s, 10 Gbit/s bis ca. 55 m', 'Heute üblich im Büro'], ['Cat6a', '10 Gbit/s bis 100 m', 'Geschirmt, für 10GBASE-T'], ['Cat8', '25/40 Gbit/s bis 30 m', 'Nur Rechenzentrum, kurze Strecken']]) +
    `<p>Moderne Ports erkennen die Belegung selbst (<b>Auto-MDI-X</b>), deshalb brauchst du keine gekreuzten Kabel mehr. Über Kupfer läuft auch [[poe|PoE]].</p>` + plan('Kabeltyp „Kupfer Cat6“ verbindet RJ45-Ports (und Kupfer-SFPs wie GLC-TE).'),
    ['stecker-rj45', 'poe', 'duplex-speed', 'patchpanel']);
  art('kabel-mmf', 'kabel', 'Glasfaser Multimode (OM3/OM4)', 'Kurze Strecken im Rechenzentrum, 850 nm.',
    `<p>Multimode-Fasern haben einen <b>50-µm-Kern</b>. Mehrere Lichtmoden laufen parallel, deshalb ist die Reichweite begrenzt. Sender sind günstige Laser (VCSEL) bei <b>850 nm</b>. OM3 hat einen aquafarbenen Mantel, OM4 ist oft violett oder ebenfalls aqua.</p>` + tbl(['Standard', 'OM3', 'OM4'], [['10GBASE-SR', '300 m', '400 m'], ['25GBASE-SR', '70 m', '100 m'], ['100GBASE-SR4 (MPO)', '70 m', '100 m'], ['16G Fibre Channel (SW)', '100 m', '125 m'], ['32G Fibre Channel (SW)', '70 m', '100 m']]) +
    `<p>Mit steigender Geschwindigkeit sinkt die Reichweite. Multimode braucht <b>SR- oder SW-Transceiver</b>. Ein LR-Transceiver passt nicht darauf.</p>` + plan('Kabeltyp „Glas OM3 (MM)“. Verbinde nur Ports, deren Transceiver beide Multimode-tauglich sind, sonst bleibt der Link down.'),
    ['kabel-smf', 'stecker-lc', 'stecker-mpo', 'transceiver-grundlagen']);
  art('kabel-smf', 'kabel', 'Glasfaser Singlemode (OS2)', 'Große Entfernungen, 1310 und 1550 nm.',
    `<p>Singlemode-Fasern haben einen <b>9-µm-Kern</b>, nur eine Lichtmode läuft. Dadurch gibt es kaum Dispersion und die Strecken werden lang. Der Mantel ist gelb. Die Sender (DFB-Laser) sind teurer als bei Multimode.</p>` + tbl(['Standard', 'Reichweite'], [['1000BASE-LX/LH', '10 km'], ['10GBASE-LR', '10 km'], ['10GBASE-ER', '40 km'], ['100GBASE-LR4', '10 km (vier Wellenlängen auf einer Faser)']]) +
    `<p>Faustregel: Singlemode für Standortverbindungen, Multimode im Rack und im Gebäude.</p>` + plan('Kabeltyp „Glas OS2 (SM)“ braucht LR-/LX-Transceiver an beiden Enden.'),
    ['kabel-mmf', 'stecker-lc', 'transceiver-grundlagen']);
  art('kabel-dac', 'kabel', 'DAC: Direct Attach Copper', 'Kupfer-Kabel mit festen SFP-Steckern, 1 bis 5 m.',
    `<p>Ein DAC ist ein <b>Twinax-Kupferkabel mit fest angeschlossenen Steckern</b> (SFP+, SFP28 oder QSFP28). Du brauchst keine Transceiver. Er ist günstiger, spart Strom und hat die kleinste Latenz. Der Nachteil: Die Länge ist auf etwa <b>1 bis 5 m</b> (passiv) begrenzt.</p>` +
    `<p>Typischer Einsatz: Server im selben Rack wie der Top-of-Rack-Switch. Aktive DACs und [[kabel-aoc|AOCs]] überbrücken etwas mehr.</p>` + plan('Kabeltyp „DAC (passiv)“. Er geht nur an SFP+/SFP28/QSFP28-Ports und braucht keinen Transceiver im Slot.'),
    ['kabel-aoc', 'transceiver-grundlagen', 'formfaktoren']);
  art('kabel-aoc', 'kabel', 'AOC: Active Optical Cable', 'Fest verbundenes Glasfaserkabel mit Steckern.',
    `<p>Ein AOC hat auf beiden Seiten einen fest montierten optischen Transceiver und dazwischen Multimode-Glasfaser. Er wiegt wenig, ist dünn und erreicht etwa <b>3 bis 100 m</b>. Im Planer gibt es ihn nicht. Nimm stattdessen zwei SR-Transceiver mit Multimode-Kabel.</p>`, ['kabel-dac', 'kabel-mmf']);
  art('stecker-rj45', 'kabel', 'RJ45-Stecker', 'Der Standardstecker für Ethernet über Kupfer.', `<p>RJ45 hat acht Kontakte. 10/100BASE-T nutzt zwei Paare, 1000BASE-T und schneller alle vier. Die Belegung nach T568B ist in Europa üblich. RJ45 sitzt an Clients, Access-Ports und Management-Ports (iBMC, Console-LAN).</p>`, ['kabel-cu', 'poe']);
  art('stecker-lc', 'kabel', 'LC-Stecker (Glasfaser)', 'Kleiner Duplex-Stecker für SFP-Transceiver.', `<p>LC ist der Standardstecker für SFP/SFP+/SFP28. Zwei Fasern (Duplex): eine sendet, eine empfängt. Die Fasern müssen <b>gekreuzt</b> ankommen (Tx an Rx). Fertige Duplex-Patchkabel erledigen das (Polarität A-B). Vertauscht ist ein häufiger Grund für „Link down“ nach Neuverkabelung.</p>`, ['kabel-mmf', 'kabel-smf', 'stecker-sc']);
  art('stecker-sc', 'kabel', 'SC-Stecker (Glasfaser)', 'Älterer, größerer Faserstecker.', `<p>SC ist ein Push-Pull-Stecker in Quadratform. Er kommt in älteren Installationen und Patchpanels vor. Moderne Transceiver nutzen [[stecker-lc|LC]].</p>`, ['stecker-lc']);
  art('stecker-mpo', 'kabel', 'MPO/MTP-Stecker', 'Vielfaser-Stecker für 40G und 100G.', `<p>MPO (MTP ist eine Markenvariante) hat 12 oder 24 Fasern in einem Stecker. 100GBASE-SR4 sendet über vier Fasern und empfängt über vier weitere, also acht von zwölf. Dadurch brauchst du <b>Breakout-Kabel</b> oder Kassetten, wenn du auf einzelne LC-Ports aufteilen willst.</p>`, ['kabel-mmf', 'formfaktoren']);
  art('patchpanel', 'kabel', 'Patchpanel und strukturierte Verkabelung', 'Warum es feste Leitungen und Patchkabel gibt.', `<p>In Gebäuden liegen <b>feste Leitungen</b> (bis 90 m) von der Dose zum Patchpanel im Rack. Mit kurzen <b>Patchkabeln</b> verbindest du das Panel mit dem Switch. Dadurch änderst du Zuordnungen, ohne Kabel neu zu verlegen. Die Patchliste aus dem Export zeigt dir, welcher Switchport mit welchem Gegenstück verbunden ist.</p>` + plan('Der Export „Patchliste (CSV)“ listet alle Kabel mit beiden Enden und dem Kabeltyp.'), ['kabel-cu', 'poe']);
  art('kabel-farben', 'kabel', 'Farbcodes im Planer', 'Was Kabel-, LED- und VLAN-Farben bedeuten.', `<p>Im Netzplan haben Kabel feste Farben, damit du Medien auf einen Blick erkennst.</p>` + tbl(['Farbe', 'Bedeutung'], [['Blau', 'Kupfer Cat6'], ['Türkis', 'Glasfaser Multimode (OM3)'], ['Gelb', 'Glasfaser Singlemode (OS2)'], ['Violett', 'DAC']]) + `<p>An den Kabelenden zeigen Lampen den Zustand: <b>grün</b> = Link up, <b>gelb</b> = err-disabled, <b>rot</b> = kein Link, <b>grau</b> = administrativ aus.</p><p>Port-Farben im Frontpanel zeigen das VLAN, gestreift bedeutet <b>Trunk</b>. Siehe [[port-leds]].</p>`, ['kabel-uebersicht', 'port-leds']);

  // ---------------------------------------------------------------- Ports
  art('formfaktoren', 'ports', 'SFP, SFP+, SFP28, QSFP28: Steckplätze', 'Gleiche Bauform, steigende Geschwindigkeit.', `<p>Die „Form“ des Steckplatzes bestimmt, welche Module hineinpassen und welche Geschwindigkeit möglich ist.</p>` + tbl(['Steckplatz', 'Geschwindigkeit', 'Hinweis'], [['SFP', '1 Gbit/s', 'Nimmt nur SFP-Module'], ['SFP+', '10 Gbit/s (und 1G mit SFP-Modul)', 'Abwärtskompatibel zu SFP'], ['SFP28', '25 Gbit/s (und 10G mit SFP+-Modul)', 'Gleiche Größe wie SFP+'], ['QSFP+', '40 Gbit/s', 'Vier Lanes zu je 10G'], ['QSFP28', '100 Gbit/s', 'Vier Lanes zu je 25G; Breakout auf 4× 25G möglich'], ['FC-SFP+', '8/16/32 Gbit/s Fibre Channel', 'Nur für FC-Switches und HBAs']]) + `<p>Ein Modul kann in einen <b>schnelleren</b> Steckplatz (SFP in SFP+), aber nicht umgekehrt. Ein SFP+-Modul läuft nicht in einem SFP-Steckplatz.</p>` + plan('Im Port-Reiter siehst du pro Port die Bauform. Im Inspektor wählst du das Transceiver-Modul.'), ['transceiver-grundlagen', 'kabel-dac']);
  art('transceiver-grundlagen', 'ports', 'Transceiver: Module für Glasfaser und Kupfer', 'Wie Module, Medium und Gegenstelle zusammenpassen.', `<p>Ein Transceiver wandelt elektrische Signale des Switches in Licht (oder Kupfersignale) um. Er ist <b>hot-pluggable</b> und steckt im SFP-/QSFP-Slot. Für eine Verbindung gilt:</p>` + ul(['<b>Das Medium muss passen:</b> SR/SW braucht Multimode, LR/LX braucht Singlemode.', '<b>Beide Seiten brauchen denselben Typ</b>, zum Beispiel SR an SR.', '<b>Die Geschwindigkeit muss zum Port passen</b> (siehe [[formfaktoren]]).', '<b>Protokoll beachten:</b> Ein FC-Transceiver gehört in einen FC-Port, ein Ethernet-Modul in einen Ethernet-Port.']) + `<p>Bei Kupfer-DAC ([[kabel-dac]]) sind die Module im Kabel eingebaut.</p>` + plan('Im Port-Inspektor wählst du das Modul. Der Ping-Debugger und der Port-Status nennen den Grund, wenn Medium oder Speed nicht passen.'), ['formfaktoren', 'kabel-mmf', 'kabel-smf']);
  art('port-leds', 'ports', 'Portstatus und LEDs', 'Link up, err-disabled, kein Link, shutdown.', tbl(['Zustand', 'Bedeutung', 'Typische Ursache'], [['<b>Link up</b> (grün)', 'Verbindung steht', 'Alles in Ordnung'], ['<b>Kein Link</b> (rot)', 'Kabel steckt, aber keine Verbindung', 'Falsches Medium, Gegenstelle aus, Transceiver passt nicht, Faser vertauscht'], ['<b>err-disabled</b> (gelb)', 'Switch hat den Port abgeschaltet', '[[bpdu-guard]], Port-Security-Verstoß'], ['<b>shutdown</b> (grau)', 'Administrativ ausgeschaltet', 'Befehl <code>shutdown</code> am Interface']]) + `<p>Mit <code>show interfaces status</code> siehst du den Zustand pro Port. err-disabled hebst du auf, indem du erst die Ursache beseitigst und dann <code>shutdown</code> und <code>no shutdown</code> eingibst.</p>`, ['err-disabled', 'bpdu-guard', 'kabel-farben']);
  art('poe', 'ports', 'PoE: Power over Ethernet', 'Strom über das Netzwerkkabel für Telefone, APs, Kameras.', tbl(['Standard', 'Leistung am Port', 'Typisch'], [['802.3af (PoE)', '15,4 W', 'IP-Telefon'], ['802.3at (PoE+)', '30 W', 'Access Point, Kamera'], ['802.3bt Typ 3/4', '60 / 90 W', 'Starke APs, Displays']]) + `<p>Der Switch hat ein <b>PoE-Budget</b> (Gesamtleistung). Ist es ausgeschöpft, bekommen weitere Geräte keinen Strom. Der Catalyst 9200L-24P liefert PoE+ an 24 Ports.</p>`, ['kabel-cu', 'hw-c9200l-24p-4x']);
  art('duplex-speed', 'ports', 'Autonegotiation, Duplex und Speed', 'Warum falsche Duplex-Einstellungen Probleme machen.', `<p>Beide Seiten handeln Geschwindigkeit und Duplex aus (<b>Autonegotiation</b>). Bei <b>Full Duplex</b> kann gleichzeitig gesendet und empfangen werden. Ein <b>Duplex-Mismatch</b> (eine Seite fest auf Full, die andere Auto) führt zu Kollisionen und sehr schlechtem Durchsatz, obwohl der Link „up“ ist. Faustregel: entweder auf beiden Seiten Auto oder auf beiden Seiten fest.</p>`, ['kabel-cu', 'port-leds']);
  art('ibmc', 'ports', 'iBMC / BMC: Fernwartung von Servern', 'Eigener Management-Port zum Steuern des Servers.', `<p>Das <b>Baseboard Management Controller</b> (BMC) ist ein kleiner Zusatzrechner im Server mit eigener Netzwerkbuchse. Bei Huawei heißt er <b>iBMC</b>, bei Dell iDRAC, bei HPE iLO. Du kannst darüber ein- und ausschalten, die Konsole sehen und ein ISO einbinden, auch wenn das Betriebssystem nicht läuft. Der Port gehört in ein eigenes <b>Management-VLAN</b>.</p>` + plan('Servermodelle haben einen Port „ibmc“ (blau markiert als Management).'), ['hw-hw-2288h-v5', 'vlan']);
  art('pcie-karten', 'ports', 'PCIe-Slots und Einsteckkarten', 'Netzwerk-, FC- und Storage-Karten.', `<p>Server und Storage-Controller haben <b>PCIe-Slots</b>, in die du Karten steckst: Ethernet-Karten (NIC), Fibre-Channel-HBAs oder Interface-Module. Welche Ports ein Gerät hat, hängt von den Karten ab.</p><p>Karten mit <b>RoCE</b> (RDMA over Converged Ethernet) beschleunigen Storage-Zugriffe, brauchen aber ein verlustfreies Netz mit [[pfc]].</p>` + plan('Im Geräte-Inspektor wählst du die Karte je Slot. Beim Wechsel verschwinden Kabel an Ports, die es nicht mehr gibt.'), ['hba', 'roce', 'nvme-of']);

  // ---------------------------------------------------------------- Geräte (Typen)
  art('typ-switch', 'geraete', 'Switch', 'Verbindet Geräte im selben Netz auf Layer 2.', `<p>Ein Switch lernt, hinter welchem Port welche MAC-Adresse sitzt, und leitet Frames gezielt weiter ([[mac-tabelle]]). Er trennt Kollisionsdomänen, aber nicht Broadcast-Domänen (dafür gibt es [[vlan|VLANs]]). Ein <b>Layer-3-Switch</b> routet zusätzlich zwischen VLANs ([[svi]]).</p>`, ['mac-tabelle', 'vlan', 'svi', 'hw-c9200l-24p-4x']);
  art('typ-router', 'geraete', 'Router', 'Verbindet verschiedene IP-Netze.', `<p>Ein Router entscheidet anhand der [[routing-tabelle|Routing-Tabelle]], über welche Schnittstelle ein Paket das Netz verlässt. Er trennt Broadcast-Domänen. Am Rand des Firmennetzes sitzt der <b>Edge-Router</b> zum Provider.</p>`, ['routing-tabelle', 'default-route', 'hw-isr4331']);
  art('typ-firewall', 'geraete', 'Firewall', 'Filtert Verkehr zwischen Zonen mit Regeln.', `<p>Eine <b>Stateful Firewall</b> merkt sich aufgebaute Verbindungen und lässt Antworten automatisch zurück. Sie teilt das Netz in Zonen (inside, outside, DMZ) mit <b>Security-Levels</b>. Siehe [[firewall-stateful]] und [[security-level]].</p>`, ['firewall-stateful', 'security-level', 'dmz', 'hw-asa-5516-x']);
  art('typ-fc', 'geraete', 'FC-Switch (SAN-Switch)', 'Fibre-Channel-Switch für das Speichernetz.', `<p>Ein FC-Switch verbindet Server (HBA) mit Storage. Er arbeitet mit <b>WWPN</b> statt IP und MAC. Welche Server welchen Storage sehen, legt das [[zoning]] fest.</p>`, ['fc-grundlagen', 'wwpn', 'zoning', 'hw-mds-9132t']);
  art('typ-server', 'geraete', 'Server', 'Rechner für Dienste, im Rack oder als Blade.', `<p>Server liefern Dienste wie Web, DNS, DHCP, Datenbanken oder Virtualisierung. Sie haben meist mehrere Netzwerkkarten (Daten, Storage, [[ibmc|Management]]) und sind redundant angebunden. Im Planer läuft auf jedem Server ein Linux-Terminal ([[linux-grundlagen]]).</p>`, ['ibmc', 'pcie-karten', 'linux-grundlagen']);
  art('typ-storage', 'geraete', 'Storage-System', 'Zentraler Speicher mit zwei Controllern.', `<p>Ein Storage-System stellt Speicher als <b>LUNs</b> (Block) oder Dateifreigaben bereit. Zwei Controller (A und B) sorgen für Ausfallsicherheit. Der Zugriff läuft über Fibre Channel, iSCSI oder NVMe over Fabrics. Siehe [[lun]], [[raid]], [[controller-ha]].</p>`, ['lun', 'raid', 'controller-ha', 'hw-hw-dorado-5000v6']);

  // ---------------------------------------------------------------- Layer 2
  art('mac-tabelle', 'l2', 'MAC-Adresse und MAC-Tabelle', 'Wie ein Switch Frames zum richtigen Port schickt.', `<p>Eine MAC-Adresse (48 Bit, etwa <code>52:54:00:12:34:56</code>) identifiziert eine Netzwerkkarte im lokalen Netz. Der Switch lernt aus der Absender-MAC jedes Frames, hinter welchem Port sie liegt, und speichert das in der <b>MAC-Tabelle</b>. Kennt er das Ziel nicht (<b>Unknown Unicast</b>) oder ist es ein Broadcast, schickt er den Frame an alle Ports im VLAN (Flooding).</p><p>Anzeigen: <code>show mac address-table</code>.</p>`, ['vlan', 'broadcast', 'arp']);
  art('vlan', 'l2', 'VLAN', 'Virtuelle Netze auf einem Switch: trennt ein physisches Netz in mehrere Layer-2-Netze.', `<p>Ein VLAN ist eine eigene <b>Broadcast-Domäne</b>. Geräte in verschiedenen VLANs sehen sich auf Layer 2 nicht, selbst wenn sie am selben Switch hängen. Sie reden nur über einen Router oder Layer-3-Switch miteinander. VLANs trennen Abteilungen, Server und Gäste, ohne zusätzliche Hardware.</p>` + `<p>VLAN-IDs reichen von 1 bis 4094. VLAN 1 ist das Standard-VLAN und sollte nicht für Nutzdaten dienen.</p>` + tbl(['Befehl', 'Wirkung'], [['<code>vlan 10</code> + <code>name SALES</code>', 'VLAN anlegen und benennen'], ['<code>switchport mode access</code>', 'Port als Access-Port'], ['<code>switchport access vlan 10</code>', 'Port in VLAN 10'], ['<code>show vlan brief</code>', 'Übersicht']]) + plan('Lab „VLANs segmentieren“. Im Port-Reiter färbt der Planer jeden Port nach seinem VLAN.'), ['access-port', 'trunk', 'broadcast', 'svi']);
  art('access-port', 'l2', 'Access-Port', 'Ein Port gehört zu genau einem VLAN, Frames sind ungetaggt.', `<p>Endgeräte hängen an Access-Ports. Der Switch ordnet alle eingehenden Frames dem Port-VLAN zu. Das Endgerät bemerkt von VLANs nichts.</p><pre class="code">interface g1/0/5\n switchport mode access\n switchport access vlan 10</pre>`, ['vlan', 'trunk', 'portfast']);
  art('trunk', 'l2', 'Trunk und 802.1Q', 'Mehrere VLANs über ein Kabel zwischen Switches.', `<p>Ein Trunk überträgt Frames mehrerer VLANs. Dafür setzt <b>802.1Q</b> ein 4-Byte-Tag mit der VLAN-ID in den Frame. Nur das <b>Native VLAN</b> läuft ungetaggt ([[native-vlan]]). Mit einer <b>Allowed-Liste</b> begrenzt du, welche VLANs den Trunk benutzen dürfen. Fehlt ein VLAN in der Liste, brechen alle Geräte in diesem VLAN auf der Strecke ab.</p><pre class="code">interface te1/1/1\n switchport mode trunk\n switchport trunk allowed vlan 10,20,99</pre><p>Prüfen: <code>show interfaces trunk</code>.</p>` + plan('Trunk-Ports sind im Frontpanel gestreift (Bernstein). Im Lab „Trunk“ fehlt ein VLAN in der Allowed-Liste.'), ['vlan', 'native-vlan', 'etherchannel']);
  art('native-vlan', 'l2', 'Native VLAN', 'Das VLAN, das auf dem Trunk ungetaggt läuft.', `<p>Standardmäßig ist es VLAN 1. Beide Seiten eines Trunks müssen dasselbe Native VLAN haben, sonst gibt es ein Mismatch und Frames landen im falschen VLAN. Aus Sicherheitsgründen setzt man es auf ein ungenutztes VLAN (<code>switchport trunk native vlan 999</code>).</p>`, ['trunk', 'vlan']);
  art('stp', 'l2', 'Spanning Tree (STP)', 'Verhindert Schleifen im Layer-2-Netz.', `<p>Gibt es mehrere Wege zwischen Switches, würden Broadcasts endlos kreisen (<b>Broadcast-Sturm</b>). STP wählt eine <b>Root Bridge</b> und schaltet redundante Ports auf <b>Blocking</b>. Fällt ein Weg aus, öffnet STP den Ersatzweg. Rapid-PVST+ konvergiert in Sekunden.</p>` + tbl(['Port-Rolle', 'Bedeutung'], [['Root Port', 'Bester Weg zur Root Bridge'], ['Designated Port', 'Weiterleitender Port eines Segments'], ['Alternate/Blocking', 'Ersatzweg, sendet keine Daten']]) + `<p>Befehle: <code>show spanning-tree</code>, <code>spanning-tree vlan 10 root primary</code>.</p>`, ['portfast', 'bpdu-guard', 'etherchannel']);
  art('portfast', 'l2', 'PortFast', 'Access-Ports gehen sofort in den Forwarding-Zustand.', `<p>Ohne PortFast wartet ein Port beim Einschalten bis zu 30 Sekunden, bevor er Daten weiterleitet (STP-Prüfung). Das stört DHCP und PXE-Boot. <code>spanning-tree portfast</code> darf <b>nur auf Endgeräte-Ports</b> aktiviert werden, am besten mit [[bpdu-guard]].</p>`, ['stp', 'bpdu-guard', 'access-port']);
  art('bpdu-guard', 'l2', 'BPDU Guard', 'Schaltet einen PortFast-Port ab, wenn ein Switch angeschlossen wird.', `<p>An Endgeräte-Ports erwartet der Switch keine STP-Nachrichten (BPDUs). Kommt eine an, hat jemand einen Switch angesteckt, was Schleifen auslösen kann. BPDU Guard setzt den Port auf <b>err-disabled</b>.</p><pre class="code">interface g1/0/5\n spanning-tree portfast\n spanning-tree bpduguard enable</pre>`, ['err-disabled', 'portfast', 'stp']);
  art('err-disabled', 'l2', 'err-disabled', 'Der Switch hat den Port zum Schutz abgeschaltet.', `<p>Ursachen: BPDU Guard, Port Security, Schleifenerkennung, Link-Flapping. <code>show interfaces status err-disabled</code> nennt den Grund. Behebe zuerst die Ursache, dann: <code>shutdown</code>, <code>no shutdown</code>.</p>`, ['bpdu-guard', 'port-security', 'port-leds']);
  art('port-security', 'l2', 'Port Security', 'Begrenzt, welche MAC-Adressen an einem Port erlaubt sind.', `<p>Du legst eine Höchstzahl von MACs fest (<code>switchport port-security maximum 2</code>). Eine weitere MAC löst eine <b>Violation</b> aus: Standard ist <i>shutdown</i> (der Port wird err-disabled). Mit <code>sticky</code> merkt sich der Switch gelernte Adressen.</p>`, ['err-disabled', 'dot1x']);
  art('etherchannel', 'l2', 'EtherChannel und LACP', 'Mehrere Kabel zu einer logischen Leitung bündeln.', `<p>Du bündelst 2 bis 8 Ports zu einem <b>Port-Channel</b>. Dadurch addiert sich die Bandbreite, und fällt ein Kabel aus, läuft der Rest weiter. STP sieht nur eine Leitung. <b>LACP</b> (802.3ad) handelt die Bündelung aus. Beide Seiten brauchen gleiche Speed-, Duplex- und VLAN-Einstellungen.</p><pre class="code">interface range g1/0/1 - 2\n channel-group 1 mode active</pre>`, ['trunk', 'stp', 'hsrp']);
  art('broadcast', 'l2', 'Broadcast, Unicast, Multicast', 'Wer die Nachricht empfängt.', tbl(['Art', 'Ziel', 'Beispiel'], [['Unicast', 'Ein Empfänger', 'Webseite abrufen'], ['Broadcast', 'Alle im Netz (<code>ff:ff:ff:ff:ff:ff</code>)', 'ARP-Anfrage, DHCP-Discover'], ['Multicast', 'Eine Gruppe', 'Videostreams, OSPF']]) + `<p>Broadcasts begrenzt ein Router oder ein [[vlan|VLAN]]. Sehr große Broadcast-Domänen belasten alle Geräte.</p>`, ['vlan', 'arp']);

  // ---------------------------------------------------------------- Layer 3
  art('ip-adresse', 'l3', 'IPv4-Adresse und Subnetzmaske', 'Adresse plus Maske ergibt das Netz.', `<p>Eine IPv4-Adresse hat 32 Bit, geschrieben als vier Zahlen (<code>10.0.0.20</code>). Die <b>Subnetzmaske</b> (<code>255.255.255.0</code> oder kurz <code>/24</code>) legt fest, welcher Teil das Netz und welcher das Gerät bezeichnet. Zwei Geräte sprechen direkt miteinander, wenn sie im selben Netz liegen. Sonst geht der Verkehr zum [[gateway]].</p><p>Private Bereiche: <code>10.0.0.0/8</code>, <code>172.16.0.0/12</code>, <code>192.168.0.0/16</code>.</p>`, ['subnetting', 'gateway']);
  art('subnetting', 'l3', 'Subnetting und CIDR', 'Ein Netz in kleinere Netze teilen.', tbl(['Präfix', 'Maske', 'Nutzbare Hosts'], [['/24', '255.255.255.0', '254'], ['/25', '255.255.255.128', '126'], ['/26', '255.255.255.192', '62'], ['/27', '255.255.255.224', '30'], ['/28', '255.255.255.240', '14'], ['/29', '255.255.255.248', '6'], ['/30', '255.255.255.252', '2']]) + `<p>Hosts = 2<sup>(32 − Präfix)</sup> − 2 (Netz- und Broadcast-Adresse sind nicht nutzbar). <b>Schrittweite</b> im betroffenen Oktett = 256 − Maskenwert, zum Beispiel /26 → 64. Ein <code>/30</code> passt für Punkt-zu-Punkt-Links.</p>` + plan('Der Subnetting-Trainer übt genau das mit Zufallsaufgaben und zeigt den Lösungsweg.'), ['ip-adresse', 'gateway']);
  art('gateway', 'l3', 'Standardgateway', 'Die Adresse, über die ein Gerät fremde Netze erreicht.', `<p>Liegt das Ziel nicht im eigenen Subnetz, schickt das Gerät das Paket an sein Gateway, meist ein Router oder die [[svi|SVI]] eines Layer-3-Switches. Ein falsches oder fehlendes Gateway ist eine der häufigsten Ursachen für „kein Zugriff nach außen“. Das Gateway muss im eigenen Subnetz liegen.</p>`, ['routing-tabelle', 'default-route', 'svi']);
  art('arp', 'l3', 'ARP', 'Findet die MAC-Adresse zu einer IP-Adresse.', `<p>Bevor ein Gerät ein Paket im lokalen Netz senden kann, fragt es per Broadcast: „Wer hat 10.0.0.1?“. Der Besitzer antwortet mit seiner MAC. Das Ergebnis liegt im <b>ARP-Cache</b> (<code>show ip arp</code>, Linux: <code>ip neigh</code>).</p>`, ['mac-tabelle', 'broadcast', 'gateway']);
  art('icmp-ping', 'l3', 'ICMP, Ping und Traceroute', 'Erreichbarkeit prüfen und den Weg verfolgen.', `<p><b>Ping</b> sendet ICMP-Echo-Anfragen und wartet auf Antworten. Ein „<code>!</code>“ in Cisco-Ausgaben heißt Antwort, ein „<code>.</code>“ Timeout, ein „<code>U</code>“ Ziel nicht erreichbar. <b>Traceroute</b> zeigt jeden Router (Hop) auf dem Weg. Funktioniert Ping, ist das Netz in Ordnung, und ein fehlender Dienst ist ein Anwendungsproblem. Eine ACL oder Firewall kann Ping blockieren, obwohl TCP geht.</p>` + plan('Der Ping-Debugger geht darüber hinaus: Er zeigt den Hop, an dem das Paket hängen bleibt, und nennt den Grund.'), ['routing-tabelle', 'acl']);
  art('routing-tabelle', 'l3', 'Routing-Tabelle', 'Welches Netz ist über welchen nächsten Hop erreichbar?', `<p>Der Router wählt für jedes Paket den Eintrag mit dem <b>längsten passenden Präfix</b> (Longest Prefix Match). Einträge entstehen aus direkt angeschlossenen Netzen (C), statischen Routen (S) oder dynamischen Protokollen. Gibt es keinen passenden Eintrag, wird das Paket verworfen.</p><pre class="code">ip route 10.20.0.0 255.255.255.0 192.168.1.2\nshow ip route</pre><p>Wichtig: Der Rückweg braucht ebenfalls eine Route. Ohne Rückroute kommt die Antwort nie an.</p>`, ['default-route', 'gateway', 'icmp-ping']);
  art('default-route', 'l3', 'Default-Route', 'Die Route „für alles andere“, meist Richtung Internet.', `<p>Die Default-Route <code>0.0.0.0/0</code> trifft auf jedes Ziel, für das es keinen genaueren Eintrag gibt. Am Edge-Router zeigt sie zum Provider: <code>ip route 0.0.0.0 0.0.0.0 203.0.113.1</code>. Auf Servern und PCs entspricht ihr das [[gateway|Standardgateway]].</p>`, ['routing-tabelle', 'nat']);
  art('roas', 'l3', 'Router-on-a-Stick', 'Ein Router routet zwischen VLANs über einen Trunk.', `<p>Ein Router-Port ist als Trunk mit dem Switch verbunden und hat pro VLAN eine <b>Subinterface</b> mit eigener IP und <code>encapsulation dot1Q &lt;VLAN&gt;</code>. Die Subinterface-Adresse ist das Gateway des VLANs. Der gesamte Verkehr zwischen VLANs läuft über diesen einen Link, was bei viel Verkehr zum Flaschenhals wird.</p><pre class="code">interface g0/0.10\n encapsulation dot1Q 10\n ip address 10.10.0.1 255.255.255.0</pre>`, ['vlan', 'trunk', 'svi']);
  art('svi', 'l3', 'SVI und Layer-3-Switch', 'Routing zwischen VLANs direkt im Switch.', `<p>Eine <b>SVI</b> (Switched Virtual Interface, <code>interface vlan 10</code>) ist die Router-Schnittstelle eines VLANs im Switch. Mit <code>ip routing</code> routet der Switch zwischen seinen SVIs in Hardware. Das ist schneller als [[roas|Router-on-a-Stick]] und im Campus Standard.</p><pre class="code">ip routing\ninterface vlan 10\n ip address 10.10.0.1 255.255.255.0\n no shutdown</pre>`, ['roas', 'vlan', 'gateway']);
  art('nat', 'l3', 'NAT und PAT', 'Private Adressen ins Internet übersetzen.', `<p>Private Adressen sind im Internet nicht routbar. <b>NAT</b> setzt am Rand die Absenderadresse auf eine öffentliche um. <b>PAT</b> (NAT Overload) lässt viele interne Geräte eine öffentliche Adresse teilen und unterscheidet sie über die Portnummer. Die Firewall oder der Edge-Router führt die Übersetzungstabelle (<code>show ip nat translations</code>).</p>`, ['default-route', 'firewall-stateful']);
  art('dhcp', 'l3', 'DHCP', 'Vergibt IP-Adresse, Gateway und DNS automatisch.', `<p>Der Ablauf heißt <b>DORA</b>: Discover (Broadcast), Offer, Request, Acknowledge. Der Client bekommt Adresse, Maske, Gateway, DNS und eine Lease-Zeit. Weil Discover ein Broadcast ist, muss der DHCP-Server im <b>selben VLAN</b> stehen, sonst braucht man ein <b>DHCP-Relay</b> (<code>ip helper-address</code>). Im Simulator gibt es kein Relay.</p>` + plan('Dienste-Reiter am Server (GUI) oder <code>isc-dhcp-server</code> im Linux-Terminal ([[linux-dhcp]]). Auf dem Client: <code>ipconfig /renew</code>.'), ['linux-dhcp', 'dns', 'broadcast']);
  art('dns', 'l3', 'DNS', 'Übersetzt Namen in IP-Adressen.', `<p>Der Client fragt seinen DNS-Server nach dem Namen (<code>intranet.lab.local</code>). Der Server antwortet mit der IP aus seinem <b>A-Record</b>. Probleme erkennst du so: <code>ping 10.0.0.10</code> geht, <code>ping intranet.lab.local</code> nicht → DNS-Problem, kein Netzproblem. Prüfen mit <code>nslookup</code> oder <code>dig</code>.</p>`, ['linux-bind', 'dhcp', 'icmp-ping']);
  art('http', 'l3', 'HTTP und HTTPS', 'Webprotokolle auf Port 80 und 443.', `<p>Ein Webserver lauscht auf <b>TCP 80</b> (HTTP) oder <b>443</b> (HTTPS, verschlüsselt mit TLS). „Verbindung abgelehnt“ heißt: Der Rechner antwortet, aber es lauscht kein Dienst. „Zeitüberschreitung“ heißt: Es kommt keine Antwort, etwa wegen Firewall oder fehlender Route.</p>`, ['tcp-udp', 'linux-nginx']);
  art('hsrp', 'l3', 'HSRP: redundantes Gateway', 'Zwei Router teilen sich eine virtuelle Gateway-Adresse.', `<p>Zwei Router bilden eine <b>virtuelle IP</b>, die Clients als Gateway nutzen. Der aktive Router antwortet, bei Ausfall übernimmt der Standby ohne Änderung an den Clients. Im Simulator ist HSRP nicht enthalten, die Theorie steht im Lab „Theorie: STP, EtherChannel, HSRP“.</p>`, ['gateway', 'etherchannel']);

  // ---------------------------------------------------------------- Sicherheit
  art('acl', 'sec', 'Access Control List (ACL)', 'Regeln, die Verkehr erlauben oder blockieren.', `<p>Eine ACL wird <b>von oben nach unten</b> geprüft, die erste passende Regel gilt. Am Ende steht eine unsichtbare <b>implizite Verweigerung</b> (deny any). Platziere <b>spezifische Regeln zuerst</b>. Standard-ACLs filtern nach Quelle und stehen nahe am Ziel, erweiterte ACLs filtern nach Quelle, Ziel, Protokoll und Port und stehen nahe an der Quelle.</p><pre class="code">ip access-list extended GAESTE\n deny ip 192.168.50.0 0.0.0.255 10.0.0.0 0.255.255.255\n permit ip any any\ninterface vlan 50\n ip access-group GAESTE in</pre>` + plan('Lab „Gäste-Netz mit ACL isolieren“.'), ['firewall-stateful', 'icmp-ping']);
  art('firewall-stateful', 'sec', 'Stateful Firewall', 'Merkt sich Verbindungen und erlaubt Antworten automatisch.', `<p>Verkehr von einer Zone mit hohem Security-Level zu einer niedrigeren ist standardmäßig erlaubt, in die Gegenrichtung nicht ([[security-level]]). Hat ein Client eine Verbindung aufgebaut, lässt die Firewall die Antwort zurück, ohne zusätzliche Regel. Regeln arbeiten mit Zonen, Adressen und Ports.</p>`, ['security-level', 'dmz', 'nat', 'acl']);
  art('security-level', 'sec', 'Security-Level (ASA)', 'Zahl von 0 bis 100 pro Zone.', tbl(['Zone', 'Typischer Wert'], [['outside', '0'], ['dmz', '50'], ['inside', '100']]) + `<p>Verkehr darf standardmäßig von höher nach niedriger fließen. Für die Gegenrichtung brauchst du eine ACL. Der Zonenname heißt <code>nameif</code>.</p>`, ['firewall-stateful', 'dmz']);
  art('dmz', 'sec', 'DMZ (Demilitarisierte Zone)', 'Ein eigenes Netz für Dienste, die aus dem Internet erreichbar sind.', `<p>Webserver und Mailgateways stehen in einer DMZ zwischen Internet und Intranet. Wird ein Server angegriffen, kommt der Angreifer nicht direkt ins interne Netz. Die Firewall erlaubt: Internet → DMZ nur die nötigen Ports, DMZ → Intranet möglichst nichts.</p>`, ['firewall-stateful', 'security-level']);
  art('dot1x', 'sec', '802.1X: portbasierte Anmeldung', 'Der Port öffnet erst nach erfolgreicher Authentifizierung.', `<p>Drei Rollen: <b>Supplicant</b> (Endgerät), <b>Authenticator</b> (Switch) und <b>Authentication Server</b> (RADIUS, zum Beispiel Cisco ISE). Der Switch lässt zunächst nur EAPOL durch und fragt den Server. Je nach Ergebnis kommt das Gerät in ein VLAN, bekommt eine ACL oder wird abgewiesen.</p>`, ['mab', 'radius', 'ise-policy']);
  art('mab', 'sec', 'MAB: MAC Authentication Bypass', 'Authentifizierung per MAC für Geräte ohne 802.1X.', `<p>Drucker oder Telefone können kein 802.1X. Der Switch nutzt dann ihre MAC-Adresse als Benutzernamen und fragt den RADIUS-Server. MAB ist schwächer, weil MACs sich fälschen lassen. Meist ist es der Fallback nach 802.1X.</p>`, ['dot1x', 'radius']);
  art('radius', 'sec', 'RADIUS und AAA', 'Zentrale Anmeldung, Rechte und Protokollierung.', `<p><b>AAA</b> steht für Authentication (Wer bist du?), Authorization (Was darfst du?) und Accounting (Was hast du getan?). RADIUS ist das Protokoll zwischen Netzgerät und Server (UDP 1812/1813). Auf dem Switch aktivierst du es mit <code>aaa new-model</code> und <code>radius server</code>.</p>`, ['dot1x', 'ise-policy']);
  art('ise-policy', 'sec', 'ISE Authorization Policy', 'Regeln, die einem Endgerät ein Ergebnis zuordnen.', `<p>Die Policy besteht aus Regeln, die von oben nach unten ausgewertet werden. Eine Regel prüft Methode (802.1X/MAB), AD-Gruppe, Endpoint-Profil und Posture. Das Ergebnis ist ein <b>Autorisierungsprofil</b>, zum Beispiel PermitAccess, ein VLAN oder DenyAccess. <b>Reihenfolge zählt:</b> allgemeine Regeln weiter unten, spezifische oben.</p>` + plan('Lab „NAC Teil 2: ISE Authorization Policy“.'), ['dot1x', 'radius']);
  art('ssl-inspection', 'sec', 'SSL/TLS-Inspection', 'Die Firewall entschlüsselt HTTPS zur Prüfung.', `<p>Die Firewall spielt Man-in-the-Middle mit einem eigenen Zertifikat. Dafür muss ihre <b>Root-CA auf allen Clients</b> verteilt sein (GPO/MDM), sonst gibt es Zertifikatswarnungen. Nicht entschlüsseln solltest du Banking, Gesundheitsdaten und Dienste mit Certificate Pinning (<i>No Decrypt</i> je Kategorie).</p>`, ['firewall-stateful']);
  art('ipsec', 'sec', 'IPsec-VPN mit IKEv2', 'Verschlüsselter Tunnel zwischen Standorten.', `<p>IKEv2 handelt zuerst einen sicheren Kanal aus (<b>IKE-SA</b>, Proposal mit Verschlüsselung, Integrität, DH-Gruppe, Authentifizierung per Pre-Shared-Key oder Zertifikat) und dann die Daten-SA (<b>IPsec/ESP</b>). Beide Seiten müssen <b>identische Proposals</b> haben, sonst kommt kein Tunnel zustande. Bei einer <b>VTI</b> ist der Tunnel eine Routing-Schnittstelle, über die du normal routest.</p>` + plan('Lab „Site-to-Site-VPN mit IKEv2 (VTI)“.'), ['routing-tabelle']);
  art('ssh-haertung', 'sec', 'Gerätehärtung', 'Typische Maßnahmen für Switches und Router.', ul(['<code>enable secret</code> statt <code>enable password</code>', 'SSH statt Telnet: <code>transport input ssh</code> auf den VTY-Leitungen', 'Lokaler Admin-Benutzer mit <code>username … secret</code>', '<code>service password-encryption</code>', 'Ungenutzte Ports <code>shutdown</code> und in ein Blackhole-VLAN', 'Native VLAN ungleich 1, [[bpdu-guard]] und [[port-security]] an Access-Ports', 'Uplinks beschreiben (<code>description</code>), Syslog und NTP einrichten']) + plan('Der Export-Check („Prüfen &amp; exportieren“) meldet fehlende Härtungsschritte als Warnung.'), ['bpdu-guard', 'port-security', 'dot1x']);
  art('zero-trust', 'sec', 'Zero Trust', 'Vertraue keinem Gerät nur wegen seines Standorts.', `<p>Statt „innen ist sicher“ gilt: jede Anfrage wird anhand von Identität, Gerätezustand und Kontext geprüft, und Zugriff ist minimal. Technisch heißt das Segmentierung, 802.1X, Mikrosegmentierung und ständige Überprüfung.</p>`, ['dot1x', 'vlan']);

  // ---------------------------------------------------------------- Storage
  art('san-nas-das', 'storage', 'DAS, NAS und SAN', 'Drei Arten, Speicher anzubinden.', tbl(['Art', 'Zugriff', 'Beispiel'], [['DAS', 'Direkt am Server', 'Interne Platten'], ['NAS', 'Dateien über das Netz (NFS, SMB)', 'Dateiserver, Freigaben'], ['SAN', 'Blockgeräte (LUNs) über eigenes Netz', 'Fibre Channel, iSCSI, NVMe-oF']]) + `<p>Bei SAN sieht der Server die LUN wie eine lokale Platte und legt selbst ein Dateisystem darauf an.</p>`, ['lun', 'fc-grundlagen', 'iscsi']);
  art('fc-grundlagen', 'storage', 'Fibre Channel (FC)', 'Verlustfreies Speichernetz mit eigenen Switches.', `<p>FC ist ein eigenes Protokoll für Speichernetze mit garantierter, verlustfreier Übertragung (Buffer-to-Buffer-Credits). Es nutzt <b>HBAs</b> im Server, <b>FC-Switches</b> (Fabric) und Storage-Ports. Geschwindigkeiten: 8/16/32/64 Gbit/s. Die Verkabelung läuft meist über Multimode-Glasfaser mit FC-Transceivern ([[kabel-mmf]]). Üblich sind <b>zwei getrennte Fabrics (A und B)</b> für Redundanz.</p>`, ['wwpn', 'zoning', 'hba', 'typ-fc']);
  art('wwpn', 'storage', 'WWPN und WWNN', 'Die Adresse im Fibre-Channel-Netz.', `<p>Jeder FC-Port hat eine 64-Bit-<b>WWPN</b> (World Wide Port Name, <code>20:00:00:25:b5:aa:00:01</code>). Der <b>WWNN</b> bezeichnet den ganzen Knoten. Zoning und LUN-Masking arbeiten mit WWPNs. Sie entsprechen MAC-Adressen im Ethernet.</p>` + plan('Der Planer erzeugt pro FC-Port eine WWPN. Du findest sie im Hardware-Blatt und im Zoning-Export.'), ['zoning', 'lun-masking']);
  art('zoning', 'storage', 'FC-Zoning', 'Legt fest, welche Ports sich sehen dürfen.', `<p>Ein <b>Zone</b> enthält die WWPNs von Initiatoren (Server-HBA) und Targets (Storage-Ports). Nur Mitglieder derselben Zone sehen sich. Best Practice: <b>Single-Initiator-Zoning</b>, also eine Zone je Server-Port mit den Storage-Ports, die er braucht. Aktiv wird die Konfiguration erst im <b>Zoneset</b>, das du aktivierst.</p><pre class="code">zone name Z_SRV01_A vsan 10\n  member pwwn 20:00:...\n  member pwwn 50:00:...\nzoneset activate name ZS_FAB_A vsan 10</pre>` + plan('Der Export erzeugt für die MDS-Switches ein Zoning-Gerüst aus der Verkabelung.'), ['wwpn', 'lun-masking', 'typ-fc']);
  art('lun', 'storage', 'LUN', 'Ein Stück Speicher, das der Server als Platte sieht.', `<p>Eine LUN (Logical Unit Number) wird auf dem Storage aus einem <b>Pool</b> oder einer RAID-Gruppe erstellt und einem Host zugewiesen ([[lun-masking]]). Der Server findet sie nach dem Rescan, formatiert sie und mountet sie ([[linux-storage]]). <b>Thin Provisioning</b> reserviert beim Anlegen nur einen kleinen Teil (im Planer 10 %) und belegt den Rest erst beim Schreiben. Dadurch kann ein Pool mehr LUN-Kapazität versprechen, als er hat (<b>Überprovisionierung</b>), was Monitoring braucht.</p>` + plan('Web-GUI des Storage öffnen (Storage anklicken → „Web-GUI öffnen“) → „Speicherpools“ und „LUNs“: Pool anlegen, LUN erzeugen, Hosts zuordnen (Masking).'), ['lun-masking', 'raid', 'multipath', 'linux-storage']);
  art('lun-masking', 'storage', 'LUN-Masking', 'Legt fest, welcher Host welche LUN sieht.', `<p>Zoning entscheidet, welche Ports sich sehen. Masking entscheidet, welche <b>LUNs</b> ein Host über diese Verbindung bekommt. Beides zusammen: Der Server sieht die LUN erst, wenn <b>Zoning und Masking stimmen</b>. Fehlt eins davon, taucht die Platte im Betriebssystem nicht auf.</p>`, ['zoning', 'lun', 'multipath']);
  art('raid', 'storage', 'RAID-Level', 'Platten zusammenfassen für Tempo und Ausfallsicherheit.', tbl(['Level', 'Prinzip', 'Ausfall', 'Nutzbar'], [['RAID 0', 'Striping', 'keiner', '100 %'], ['RAID 1', 'Spiegel', '1 Platte', '50 %'], ['RAID 5', 'Striping + 1 Parität', '1 Platte', '(n−1)/n'], ['RAID 6', 'Striping + 2 Paritäten', '2 Platten', '(n−2)/n'], ['RAID 10', 'Spiegel + Striping', '1 je Spiegel', '50 %']]) + `<p>RAID ersetzt kein Backup. Große Platten rebuilden lange, deshalb ist RAID 6 oder 10 bei großen Platten üblicher als RAID 5. Moderne All-Flash-Systeme nutzen oft eigene Schutzverfahren (Erasure Coding).</p>`, ['lun', 'controller-ha']);
  art('iscsi', 'storage', 'iSCSI', 'Block-Speicher über normales Ethernet.', `<p>iSCSI transportiert SCSI-Befehle über TCP/IP (Port 3260). Es braucht kein eigenes FC-Netz, sondern ein Ethernet mit eigenem VLAN, Jumbo Frames (MTU 9000) und getrennten Pfaden. Ein <b>Initiator</b> (Server) verbindet sich mit einem <b>Target</b> (Storage), identifiziert durch einen IQN-Namen.</p>`, ['san-nas-das', 'mtu', 'multipath']);
  art('nvme-of', 'storage', 'NVMe over Fabrics', 'Schneller Flash-Zugriff über das Netz.', `<p>NVMe-oF überträgt das NVMe-Protokoll über ein Netz: über <b>RoCE</b> (Ethernet), <b>TCP</b> oder <b>Fibre Channel</b> (FC-NVMe). Es hat sehr niedrige Latenz, nutzt viele parallele Warteschlangen und passt zu All-Flash-Storage.</p>`, ['roce', 'pfc', 'iscsi']);
  art('roce', 'storage', 'RoCE (RDMA over Converged Ethernet)', 'Direkter Speicherzugriff ohne CPU-Umweg.', `<p>RDMA kopiert Daten von Speicher zu Speicher an der CPU vorbei. RoCE v2 setzt das auf UDP/IP. Es verträgt <b>keine Paketverluste</b>, deshalb braucht das Netz [[pfc]] und ECN für ein verlustfreies Verhalten, sowie Jumbo Frames.</p>`, ['pfc', 'nvme-of', 'mtu']);
  art('pfc', 'storage', 'PFC: Priority Flow Control', 'Pausiert gezielt eine Verkehrsklasse statt alles.', `<p>PFC (802.1Qbb) sendet ein Pause-Signal für eine einzelne Priorität (CoS), sobald Puffer volllaufen. So gehen RoCE-Pakete nicht verloren. Der Switchport braucht <code>priority-flow-control mode on</code> und MTU 9216. Falsch konfiguriertes PFC kann das ganze Netz blockieren (PFC-Storm).</p>`, ['roce', 'mtu']);
  art('multipath', 'storage', 'Multipathing (MPIO)', 'Mehrere Pfade zwischen Server und Storage.', `<p>Ein Server hat zwei HBAs, geht über zwei Fabrics zu beiden Storage-Controllern. Das Betriebssystem fasst die vier Pfade zu <b>einer</b> LUN zusammen und nutzt sie parallel oder als Reserve. Fällt ein Pfad aus, läuft der Betrieb weiter. Ohne Multipath-Treiber sieht der Server dieselbe LUN mehrfach.</p>`, ['lun', 'zoning', 'controller-ha']);
  art('controller-ha', 'storage', 'Storage-Controller und Hochverfügbarkeit', 'Zwei Controller, damit ein Ausfall nichts stoppt.', `<p>Ein Storage-System hat zwei Controller (A und B), die den Speicher teilen. Beide arbeiten (<b>Active/Active</b>) oder einer ist Reserve. Fällt ein Controller aus, übernimmt der andere seine LUNs (<b>Failover</b>). Deshalb verbindest du <b>beide Controller</b> mit dem Netz.</p>`, ['multipath', 'raid', 'typ-storage']);
  art('hba', 'storage', 'HBA (Host Bus Adapter)', 'Die Fibre-Channel-Karte im Server.', `<p>Ein HBA ist für FC das, was die Netzwerkkarte für Ethernet ist. Er hat 1 bis 4 Ports mit je einer WWPN und braucht passende [[transceiver-grundlagen|Transceiver]]. Zwei Ports führst du an zwei getrennte Fabrics.</p>`, ['wwpn', 'fc-grundlagen', 'pcie-karten']);

  // ---------------------------------------------------------------- Server
  art('linux-grundlagen', 'server', 'Linux-Terminal: Grundbefehle', 'Die wichtigsten Befehle im Server-Terminal des Planers.', tbl(['Aufgabe', 'Befehl'], [['Wo bin ich, was liegt hier?', '<code>pwd</code>, <code>ls -l</code>, <code>cd /etc</code>'], ['Datei lesen', '<code>cat datei</code>, <code>head -n 5 datei</code>, <code>tail -n 20 datei</code>'], ['Text suchen', '<code>grep -i fehler /var/log/syslog</code>'], ['Datei schreiben', '<code>echo "text" &gt; datei</code>, <code>&gt;&gt;</code> hängt an'], ['Text ersetzen', '<code>sed -i \'s/alt/neu/\' datei</code>'], ['Kopieren, verschieben, löschen', '<code>cp</code>, <code>mv</code>, <code>rm</code>, <code>mkdir</code>'], ['Pipes', '<code>ps aux | grep nginx</code>'], ['Rechte', '<code>sudo …</code>, <code>chmod 644 datei</code>'], ['Hilfe', '<code>help</code>']]) + `<p>Systemdateien (unter <code>/etc</code>, <code>/var</code>) darf nur root ändern, deshalb brauchst du <code>sudo</code>. Das Terminal gibt es nicht in Echt, es ist ein Lernmodell: Es hat keinen Editor (nutze <code>echo</code>, <code>tee</code> und <code>sed</code>).</p>` + plan('Doppelklick auf einen Server oder Reiter „Konsole“. Fünf Szenarien unter „Aufgaben“ üben das.'), ['linux-rechte', 'linux-systemd', 'linux-apt', 'linux-platte']);
  art('linux-rechte', 'server', 'Dateirechte und sudo', 'Wer darf lesen, schreiben, ausführen?', `<p>Jede Datei hat einen Besitzer, eine Gruppe und neun Rechtebits: Besitzer, Gruppe, andere, jeweils <b>r</b> (lesen, 4), <b>w</b> (schreiben, 2), <b>x</b> (ausführen, 1). <code>644</code> = Besitzer lesen+schreiben, alle anderen lesen. <code>755</code> = zusätzlich ausführen. <code>ls -l</code> zeigt <code>-rw-r--r--</code>. <code>sudo</code> führt einen Befehl als root aus. Sage nie „einfach alles auf 777“: das öffnet die Datei für jeden.</p>`, ['linux-grundlagen']);
  art('linux-systemd', 'server', 'systemd: Dienste verwalten', 'Starten, stoppen, Status und Journal.', tbl(['Befehl', 'Wirkung'], [['<code>systemctl status nginx</code>', 'Zustand und letzte Logzeilen'], ['<code>sudo systemctl start|stop|restart nginx</code>', 'Dienst steuern'], ['<code>sudo systemctl reload nginx</code>', 'Konfiguration neu laden ohne Ausfall'], ['<code>sudo systemctl enable|disable nginx</code>', 'Start beim Booten an/aus'], ['<code>systemctl is-active nginx</code>', 'active, inactive oder failed'], ['<code>systemctl --failed</code>', 'Alle fehlgeschlagenen Dienste'], ['<code>journalctl -u nginx -n 20</code>', 'Letzte Logzeilen eines Dienstes']]) + `<p><b>Vorgehen bei „Dienst startet nicht“:</b> 1. <code>systemctl status</code>, 2. <code>journalctl -u</code>, 3. Konfiguration prüfen (nginx: <code>nginx -t</code>), 4. beheben, 5. <code>restart</code>. Ein häufiger Grund ist eine volle Platte ([[linux-platte]]).</p>`, ['linux-nginx', 'linux-bind', 'linux-dhcp', 'linux-platte']);
  art('linux-apt', 'server', 'apt: Pakete installieren', 'Software auf Ubuntu/Debian.', `<p><code>sudo apt update</code> lädt die Paketlisten, <code>sudo apt install nginx</code> installiert, <code>sudo apt remove nginx</code> entfernt. Der Server braucht dafür <b>IP, Gateway und eine Verbindung ins Internet</b>. Fehlt das Gateway, meldet apt „Temporary failure resolving“. Dienste wie nginx starten nach der Installation automatisch, isc-dhcp-server nicht (erst konfigurieren).</p>`, ['linux-grundlagen', 'gateway']);
  art('linux-nginx', 'server', 'nginx: Webserver', 'Konfiguration, Test und Seiteninhalt.', `<p>Konfiguration: <code>/etc/nginx/nginx.conf</code>. Wichtige Zeilen: <code>listen 80;</code>, <code>root /var/www/html;</code>. Jede Direktive endet mit <code>;</code>. Die Standardseite liegt in <code>/var/www/html/index.html</code>. Vor jedem Neustart: <code>sudo nginx -t</code>. Dann <code>sudo systemctl reload nginx</code>.</p>` + ul(['Fehlt ein Semikolon, startet nginx nicht (<code>[emerg] directive … is not terminated by ";"</code>).', 'Hört nginx auf Port 8080, antwortet <code>http://server</code> (Port 80) nicht.', 'Ist die Host-Firewall ([[linux-ufw]]) aktiv, muss Port 80 erlaubt sein.']), ['linux-systemd', 'linux-ufw', 'http']);
  art('linux-bind', 'server', 'bind9: DNS-Server', 'Zonendatei, Start und Test.', `<p>Im Planer liest bind9 die Zonendatei <code>/etc/bind/db.lab</code>. Einträge: <code>intranet IN A 10.0.0.10</code> (relativ zur Zone) oder <code>www.lab.local. IN A 10.0.0.11</code> (mit Punkt am Ende = vollständig). Nach jeder Änderung: <code>sudo systemctl restart bind9</code>. Der Client braucht diesen Server als DNS-Server. Ein Tippfehler in der IP (zum Beispiel <code>10.0.0</code>) lässt den Dienst nicht starten.</p>`, ['dns', 'linux-systemd']);
  art('linux-dhcp', 'server', 'isc-dhcp-server: DHCP unter Linux', 'dhcpd.conf und Start.', `<p>Die Konfiguration steht in <code>/etc/dhcp/dhcpd.conf</code>:</p><pre class="code">subnet 10.0.0.0 netmask 255.255.255.0 {\n  range 10.0.0.100 10.0.0.150;\n  option routers 10.0.0.1;\n  option domain-name-servers 10.0.0.10;\n}</pre><p>Das <b>subnet</b> muss das Netz der Server-Schnittstelle enthalten, sonst meldet der Dienst „Not configured to listen on any interfaces“. Danach <code>sudo systemctl restart isc-dhcp-server</code>. Auf dem Client: <code>ipconfig /renew</code>.</p>`, ['dhcp', 'linux-systemd']);
  art('linux-ufw', 'server', 'ufw: Host-Firewall', 'Ports auf dem Server freigeben.', `<p><code>sudo ufw allow 22</code> erlaubt SSH, <code>sudo ufw allow 80</code> HTTP, <code>sudo ufw enable</code> aktiviert die Firewall, <code>sudo ufw status</code> zeigt Regeln. Wichtig: <b>erst SSH erlauben, dann aktivieren</b>, sonst sperrst du dich aus. Ist ufw aktiv und der Port nicht erlaubt, läuft der Dienst zwar, aber Clients bekommen eine Zeitüberschreitung.</p>`, ['linux-nginx', 'firewall-stateful']);
  art('linux-platte', 'server', 'Festplatte voll', 'Platz finden und schaffen.', `<p><code>df -h</code> zeigt die Belegung. Den Verursacher findest du mit <code>sudo du -sh /var/log/*</code> oder <code>sudo find / -size +1G</code>. Eine Logdatei, die ein Prozess offen hält, leerst du mit <code>sudo truncate -s 0 datei</code> und löschst sie nicht (der Platz würde sonst erst nach einem Dienstneustart frei). Bei voller Platte starten Dienste nicht mehr, weil sie nicht schreiben können. Vorbeugen: <code>logrotate</code>, Monitoring und Alarm ab 80 %.</p>`, ['linux-systemd', 'linux-grundlagen']);
  art('linux-storage', 'server', 'SAN-LUN am Linux-Server nutzen', 'Rescan, lsblk, multipath, Dateisystem und Mount.', `<p>Eine LUN erscheint am Server erst, wenn <b>Zoning, Masking und Verkabelung</b> stimmen ([[zoning]], [[lun-masking]]) und das Betriebssystem neu gescannt hat. Der Weg im Terminal:</p>` + tbl(['Schritt', 'Befehl'], [['1. Neu scannen', '<code>sudo rescan-scsi-bus.sh</code> oder <code>echo "- - -" | sudo tee /sys/class/scsi_host/host0/scan</code>'], ['2. Platten ansehen', '<code>lsblk</code>. Jeder Pfad ist ein eigenes <code>sdX</code>-Gerät.'], ['3. Pfade bündeln', '<code>sudo apt install multipath-tools</code>, dann <code>multipath -ll</code> (ein <code>mpatha</code> mit allen Pfaden)'], ['4. Dateisystem anlegen', '<code>sudo mkfs.ext4 /dev/mapper/mpatha</code> (nicht auf <code>sdb</code>!)'], ['5. Einbinden', '<code>sudo mkdir /data</code>, <code>sudo mount /dev/mapper/mpatha /data</code>, <code>df -h</code>']]) + `<p>Ohne Multipath-Treiber sieht der Server dieselbe LUN <b>mehrfach</b> (ein Gerät je Pfad). Schreibst du auf zwei davon, zerstörst du das Dateisystem. Deshalb verweigert <code>mkfs</code> die Pfad-Geräte, sobald Multipath aktiv ist. Fällt ein Pfad aus, zeigt <code>multipath -ll</code> ihn als <code>failed faulty</code>, der Betrieb läuft über die übrigen weiter.</p>` + plan('Vier Storage-Szenarien unter „Aufgaben“: LUN einrichten, Server sieht LUN nicht, RAID dimensionieren, fehlende Pfade.'), ['lun', 'multipath', 'zoning', 'linux-grundlagen']);
  art('win-powershell', 'server', 'Windows-Terminal: PowerShell-Grundlagen', 'Cmdlets, Parameter und Pipeline im Planer.', `<p>PowerShell-Befehle heißen <b>Cmdlets</b> und folgen dem Muster <code>Verb-Nomen</code> (<code>Get-Service</code>, <code>New-ADUser</code>). Parameter beginnen mit <code>-</code>. Das Ergebnis ist eine Objektliste, die du mit <code>|</code> weitergibst.</p>` + tbl(['Aufgabe', 'Befehl'], [['IP-Adresse setzen', '<code>New-NetIPAddress -InterfaceAlias Ethernet0 -IPAddress 10.0.0.10 -PrefixLength 24 -DefaultGateway 10.0.0.1</code>'], ['DNS-Server setzen', '<code>Set-DnsClientServerAddress -InterfaceAlias Ethernet0 -ServerAddresses 10.0.0.10</code>'], ['Netz prüfen', '<code>ipconfig /all</code>, <code>ping</code>, <code>Test-NetConnection 10.0.0.10 -Port 80</code>, <code>Resolve-DnsName name</code>'], ['Dienste', '<code>Get-Service</code>, <code>Start-Service DNS</code>, <code>Restart-Service W3SVC</code>'], ['Rollen', '<code>Get-WindowsFeature</code>, <code>Install-WindowsFeature -Name DNS</code>'], ['Filtern', '<code>Get-ADUser -Filter * | Select-Object Name,Enabled</code>'], ['Dateien', '<code>Get-ChildItem</code>, <code>Set-Content</code>, <code>Get-Content</code>, <code>New-Item -ItemType Directory</code>']]) + `<p>Namen mit Leerzeichen setzt du in Anführungszeichen, Kennwörter als <code>(ConvertTo-SecureString "…" -AsPlainText -Force)</code>. Windows-PCs haben denselben Befehlssatz ohne Server-Rollen.</p>` + plan('Server anklicken → Betriebssystem „Windows Server 2022“ wählen, dann „Web-GUI öffnen“ (Server-Manager) oder die Konsole nutzen. Fünf Szenarien unter „Aufgaben“.'), ['ad-grundlagen', 'win-rollen', 'linux-grundlagen']);
  art('ad-grundlagen', 'server', 'Active Directory', 'Zentrale Benutzer-, Gruppen- und Computerverwaltung.', `<p><b>Active Directory (AD)</b> ist das Verzeichnis, in dem Windows-Netze Benutzer, Gruppen und Computer verwalten. Wichtige Begriffe:</p>` + tbl(['Begriff', 'Bedeutung'], [['Domäne', 'Verwaltungseinheit mit eigenem Namen, z. B. <code>lab.local</code> (NetBIOS: LAB)'], ['Domänencontroller (DC)', 'Server mit AD-Datenbank, meldet Benutzer an'], ['Gesamtstruktur (Forest)', 'Oberste Ebene; eine oder mehrere Domänen'], ['Organisationseinheit (OU)', 'Ordner im Verzeichnis, an dem man Richtlinien (GPO) hängt'], ['Benutzer, Gruppe, Computer', 'Objekte im Verzeichnis; Berechtigungen vergibt man an Gruppen'], ['GPO', 'Gruppenrichtlinie, wirkt auf Benutzer und Computer einer OU (z. B. Kennwortregeln, Zertifikate)']]) + `<p><b>Ablauf Aufbau:</b> 1. Rolle AD-Domain-Services installieren, 2. <code>Install-ADDSForest -DomainName lab.local …</code>, 3. OUs, Gruppen und Benutzer anlegen, 4. Clients über DNS die Domäne finden lassen und beitreten (<code>Add-Computer</code>). Beim Kennwort verlangt die Domäne <b>Komplexität</b>: mindestens 7 Zeichen aus drei von vier Klassen.</p><p><b>AGDLP-Prinzip:</b> Accounts → Global Groups → Domain Local Groups → Permissions. Du vergibst Rechte nie an einzelne Benutzer, sondern an Gruppen.</p>` + plan('Der Domänencontroller betreibt automatisch DNS mit der Zone der Domäne. Clients brauchen ihn als DNS-Server.'), ['ad-dns', 'win-join', 'win-powershell']);
  art('ad-dns', 'server', 'DNS in der Domäne', 'Ohne DNS findet kein Client den Domänencontroller.', `<p>Clients suchen die Domäne über DNS (SRV-Einträge, im Simulator den Namen der Domäne). Deshalb muss der <b>DNS-Server des Clients der Domänencontroller</b> sein. Zeigt der Client auf einen Router oder einen öffentlichen DNS, scheitert der Beitritt mit „Die angegebene Domäne ist nicht vorhanden oder konnte nicht kontaktiert werden“. Prüfen: <code>Resolve-DnsName lab.local</code> auf dem Client.</p>`, ['ad-grundlagen', 'dns', 'win-join']);
  art('win-join', 'server', 'Domänenbeitritt', 'Einen Windows-PC oder Server in die Domäne aufnehmen.', `<p><code>Add-Computer -DomainName lab.local -Credential lab\\administrator</code>. Voraussetzungen: 1. IP-Adresse und Netz stimmen, 2. DNS-Server = Domänencontroller, 3. der DC antwortet (Dienste DNS und NTDS laufen). Danach hat der DC ein Computerkonto (<code>Get-ADComputer -Filter *</code>), und <code>whoami</code> zeigt <code>lab\\…</code>.</p><p>Fehlersuche in der Reihenfolge: Ping zum DC → <code>Resolve-DnsName lab.local</code> → Dienste auf dem DC → Uhrzeit (Kerberos erlaubt 5 Minuten Abweichung).</p>`, ['ad-dns', 'ad-grundlagen']);
  art('win-rollen', 'server', 'Windows-Rollen und -Features', 'Dienste per Install-WindowsFeature nachrüsten.', tbl(['Rolle', 'Name', 'Wirkung im Planer'], [['Active Directory-Domänendienste', '<code>AD-Domain-Services</code>', 'Voraussetzung für <code>Install-ADDSForest</code>'], ['DNS-Server', '<code>DNS</code>', 'Zonen und A-Records, Dienst DNS'], ['DHCP-Server', '<code>DHCP</code>', 'Bereich, Optionen, Dienst DHCPServer; in der Domäne autorisieren'], ['Webserver (IIS)', '<code>Web-Server</code>', 'Dienst W3SVC, Startseite unter <code>C:\\inetpub\\wwwroot</code>, Firewall-Regel Port 80'], ['Dateiserver', '<code>FS-FileServer</code>', 'Freigaben mit <code>New-SmbShare</code>']]) + `<p>Immer mit <code>Get-WindowsFeature</code> prüfen, was installiert ist.</p>`, ['win-powershell', 'win-dhcp', 'win-iis']);
  art('win-dhcp', 'server', 'DHCP unter Windows', 'Bereich, Optionen und Autorisierung.', `<p><code>Install-WindowsFeature DHCP</code>, dann <code>Add-DhcpServerv4Scope -Name LAN -StartRange 10.0.0.100 -EndRange 10.0.0.150 -SubnetMask 255.255.255.0</code> und <code>Set-DhcpServerv4OptionValue -Router 10.0.0.1 -DnsServer 10.0.0.10</code>. Der Bereich muss im <b>Netz der Server-Schnittstelle</b> liegen. In einer Domäne muss der Server zusätzlich in AD <b>autorisiert</b> sein (<code>Add-DhcpServerInDC</code>), sonst vergibt er nichts. Das schützt vor fremden DHCP-Servern.</p>`, ['dhcp', 'win-rollen', 'ad-grundlagen']);
  art('win-iis', 'server', 'IIS und die Windows-Firewall', 'Webseite bereitstellen und den Port freigeben.', `<p>IIS installierst du mit <code>Install-WindowsFeature Web-Server</code>. Die Startseite ist <code>C:\\inetpub\\wwwroot\\index.html</code>, der Dienst heißt <b>W3SVC</b>. Die Windows-Firewall lässt eingehend nur erlaubte Ports durch. Die Regel „World Wide Web Services (HTTP Traffic-In)“ gibt Port 80 frei. Ist sie deaktiviert, läuft IIS zwar, Clients bekommen aber eine Zeitüberschreitung. Prüfen: <code>Get-NetFirewallRule</code>, <code>Test-NetConnection 10.0.0.30 -Port 80</code>.</p>`, ['win-rollen', 'http', 'linux-nginx']);
  art('virt-grundlagen', 'server', 'Virtualisierung: Hypervisor und VMs', 'Mehrere virtuelle Server auf einem physischen Server.', `<p>Ein <b>Hypervisor</b> teilt die Hardware eines Servers (<b>Host</b>) auf mehrere <b>virtuelle Maschinen</b> (VMs, Gäste) auf. Jede VM hat eigene vCPUs, eigenen Arbeitsspeicher, eine virtuelle Platte und virtuelle Netzwerkkarten. Typ 1 läuft direkt auf der Hardware (VMware ESXi, KVM, Hyper-V), Typ 2 als Programm in einem Betriebssystem (VirtualBox).</p>` + tbl(['Ressource', 'Regel'], [['RAM', 'Wird fest vergeben: Summe der laufenden VMs darf den Host-RAM nicht überschreiten'], ['vCPU', 'Darf überbucht werden (im Planer bis 4:1), denn nicht jede VM rechnet dauernd'], ['Platte', 'Auf lokaler Platte oder einem gemeinsamen Datastore ([[vm-datastore]])'], ['Netz', 'Über den virtuellen Switch des Hosts ([[vswitch-vlan]])']]) + `<p>Vorteile: bessere Auslastung, schnelle Bereitstellung, Snapshots, Verschieben im Betrieb ([[vm-migration-ha]]). Nachteil: Der Host ist ein größerer Single Point of Failure, deshalb baut man Cluster.</p>` + plan('Server anklicken → „Web-GUI öffnen“ → „Virtualisierung“ → „Als Hypervisor einrichten“, dann „VM erstellen“. VMs erscheinen als gestrichelte Geräte am Host.'), ['vswitch-vlan', 'vm-datastore', 'vm-migration-ha', 'virsh-kvm']);
  art('vswitch-vlan', 'server', 'vSwitch, Uplinks und VLANs der VMs', 'Wie VMs über den Host ins physische Netz kommen.', `<p>Im Host arbeitet ein <b>virtueller Switch</b> (vSwitch). Die virtuellen Netzwerkkarten der VMs hängen an seinen <b>Port-Gruppen</b>, seine <b>Uplinks</b> sind physische Netzwerkports des Servers, die zum Switch führen. Der vSwitch schaltet VMs im selben VLAN <b>intern</b> zusammen: Zwei VMs auf demselben Host im selben VLAN sprechen miteinander, auch wenn der Uplink ausfällt.</p><p>Das VLAN einer VM setzt der Hypervisor als <b>802.1Q-Tag</b> auf die Frames am Uplink. Deshalb muss der Switchport zum Host ein <b>Trunk</b> sein, der die VLANs der VMs in der Allowed-Liste hat ([[trunk]]). Ein Access-Port nimmt keine getaggten Frames an.</p>` + ul(['<b>VM erreicht nichts:</b> Ist das Kabel an einem Uplink-Port des vSwitch?', 'Ist der Switchport ein Trunk mit dem VLAN der VM?', 'Stimmen VLAN-ID der VM und IP-Subnetz?', 'Läuft die VM, und ist der Host an?']) + plan('Szenario „VM erreicht das Netz nicht“. Im Virtualisierungs-Manager (Web-GUI des Hosts) wählst du unter „Virtueller Switch“ die Uplinks.'), ['trunk', 'vlan', 'virt-grundlagen']);
  art('vm-datastore', 'server', 'Datastore: wo die VM-Platte liegt', 'Lokal oder gemeinsam auf einer SAN-LUN.', `<p>Die Dateien einer VM liegen auf einem <b>Datastore</b>. Auf einer <b>lokalen Platte</b> sieht nur der eine Host sie. Auf einer <b>gemeinsamen LUN</b> (Fibre Channel, iSCSI, NFS) sehen sie <b>alle Hosts des Clusters</b>. Das ist die Voraussetzung für Live-Migration und HA. Dafür muss die LUN allen Hosts freigegeben sein ([[lun-masking]]) und die Zonen müssen stimmen ([[zoning]]).</p><p>Kapazität: Summe der VM-Platten auf einer LUN darf deren Größe nicht überschreiten.</p>`, ['vm-migration-ha', 'lun', 'zoning']);
  art('vm-migration-ha', 'server', 'Migration, Cluster und HA', 'VMs verschieben und Ausfälle überstehen.', tbl(['Verfahren', 'Voraussetzung', 'Wirkung'], [['Kalte Migration', 'VM aus; Hosts im selben Cluster', 'VM zieht um, Platte bleibt, wenn sie auf dem Ziel erreichbar ist'], ['Live-Migration (vMotion)', 'VM auf gemeinsamem Datastore; Ziel sieht ihn; Ziel hat freien RAM', 'VM läuft ohne Unterbrechung auf anderem Host weiter'], ['HA (High Availability)', 'Cluster, gemeinsamer Datastore, Reserve-Kapazität', 'Fällt ein Host aus, starten seine VMs auf anderen Hosts neu (kurze Unterbrechung)']]) + `<p>Ein <b>Cluster</b> ist eine Gruppe von Hosts mit gleicher Netz- und Storage-Anbindung. Typische Fehler: Datastore nur für einen Host freigegeben, Hosts mit unterschiedlichen VLANs am vSwitch, kein RAM für den Ausfall eines Hosts (<b>N+1</b>-Kapazität fehlt).</p>` + plan('Szenarien: „VMs auf zwei Hosts verteilen“, „Live-Migration über SAN-Datastore“, „Host-Ausfall und HA“.'), ['vm-datastore', 'virt-grundlagen', 'spof']);
  art('virsh-kvm', 'server', 'virsh: VMs auf einem KVM-Host', 'Befehle im Terminal des Hypervisors.', tbl(['Befehl', 'Wirkung'], [['<code>virsh list --all</code>', 'Alle VMs mit Zustand'], ['<code>sudo virsh start WEB-VM</code>', 'VM starten'], ['<code>sudo virsh shutdown WEB-VM</code>', 'VM herunterfahren'], ['<code>virsh dominfo WEB-VM</code>', 'vCPU, RAM, VLAN, Datastore'], ['<code>virsh nodeinfo</code>', 'Kerne und RAM des Hosts'], ['<code>sudo virsh migrate --live WEB-VM HV2</code>', 'Live auf einen Cluster-Host verschieben']]) + `<p>Auf einem Server ohne Hypervisor-Rolle meldet <code>virsh</code>, dass es nicht zum Hypervisor verbinden kann.</p>`, ['virt-grundlagen', 'linux-grundlagen']);
  art('web-gui', 'server', 'Web-Verwaltung der Geräte', 'Server, Storage und FC-Switch im Browser verwalten.', `<p>Wie in der Praxis haben Server, Storage-Systeme und FC-Switches eine <b>Weboberfläche</b> mit Anmeldung, Menü, Tabellen und Dialogen. Im Planer öffnest du sie über „Web-GUI öffnen“ am Gerät. Alternativ rufst du sie von einem PC aus im Webbrowser auf: <code>https://&lt;IP-Adresse&gt;:8443</code>. Dann muss das Gerät erreichbar sein (IP, Gateway, VLAN).</p>` + tbl(['Gerät', 'Oberfläche', 'Was du dort machst'], [['Linux-Server', 'Server-Web-Konsole', 'Netzwerk, Dienste, Konfigurationsdateien, Speicher, Firewall, Software, Terminal'], ['Hypervisor', 'Virtualisierungs-Manager', 'VMs, virtueller Switch, Datastores, Cluster und HA'], ['Windows-Server', 'Server-Manager', 'Rollen, Active Directory, DNS, DHCP, Freigaben, Dienste, Firewall, PowerShell'], ['Storage', 'Storage-Manager', 'Pools, LUNs, Zuordnung, Ports'], ['FC-Switch', 'Fabric-Manager', 'Ports, Zoning, VSAN']]) + `<p>Jede Aktion in der Oberfläche führt dieselben Schritte aus wie das Terminal. Unten zeigt ein Streifen „Letzte Aktionen“ den gleichwertigen Befehl. So lernst du beides: die Oberfläche für den Alltag und die Befehle für Skripte und Fehlersuche. Anmeldedaten im Simulator: <code>admin</code> und <code>NetLab-2026</code> (vorausgefüllt).</p>`, ['linux-grundlagen', 'win-powershell', 'virt-grundlagen', 'lun']);
  art('syslog', 'server', 'Syslog und Journal', 'Wo Meldungen landen.', `<p>Geräte und Dienste melden Ereignisse an einen Logserver (UDP 514). Cisco-Meldungen haben einen Schweregrad von 0 (Notfall) bis 7 (Debug), zum Beispiel <code>%LINK-3-UPDOWN</code> (Level 3 = Error). Unter Linux sammelt <b>journald</b> die Dienstlogs (<code>journalctl</code>), klassische Dateien liegen in <code>/var/log</code>.</p>`, ['linux-systemd']);

  // ---------------------------------------------------------------- IOS
  art('ios-grundlagen', 'ios', 'IOS: Modi und Grundbefehle', 'Die Befehlsebenen der Cisco-CLI.', tbl(['Modus', 'Prompt', 'Wechsel'], [['User-EXEC', '<code>Switch&gt;</code>', 'Anfang'], ['Privilegiert', '<code>Switch#</code>', '<code>enable</code>'], ['Global Config', '<code>Switch(config)#</code>', '<code>configure terminal</code> (<code>conf t</code>)'], ['Interface', '<code>Switch(config-if)#</code>', '<code>interface g1/0/1</code>']]) + tbl(['Befehl', 'Wirkung'], [['<code>hostname SW1</code>', 'Gerätename'], ['<code>show running-config</code>', 'Aktive Konfiguration'], ['<code>copy running-config startup-config</code> (<code>wr</code>)', 'Speichern'], ['<code>exit</code> / <code>end</code>', 'Eine Ebene zurück / bis Privilegiert'], ['<code>?</code>', 'Hilfe, Tab ergänzt'], ['<code>no &lt;Befehl&gt;</code>', 'Befehl zurücknehmen']]) + `<p>Abkürzungen funktionieren, solange sie eindeutig sind: <code>sh ip int br</code>.</p>`, ['ios-show', 'ios-vlan']);
  art('ios-show', 'ios', 'Wichtige show-Befehle', 'Zustand prüfen.', tbl(['Befehl', 'Zeigt'], [['<code>show ip interface brief</code>', 'IP und Status aller Interfaces'], ['<code>show interfaces status</code>', 'Port, VLAN, Speed, err-disabled'], ['<code>show vlan brief</code>', 'VLANs und ihre Ports'], ['<code>show interfaces trunk</code>', 'Trunks, Allowed VLANs'], ['<code>show mac address-table</code>', 'Gelernte MACs'], ['<code>show ip route</code>', 'Routing-Tabelle'], ['<code>show access-lists</code>', 'ACLs mit Trefferzahl'], ['<code>show spanning-tree</code>', 'STP-Zustand'], ['<code>show running-config | include ip route</code>', 'Gefilterte Ausgabe']]), ['ios-grundlagen']);
  art('ios-vlan', 'ios', 'VLAN- und Trunk-Befehle', 'Spickzettel für Layer 2.', `<pre class="code">vlan 10\n name SALES\ninterface range g1/0/1 - 2\n switchport mode access\n switchport access vlan 10\ninterface te1/1/1\n switchport mode trunk\n switchport trunk allowed vlan 10,20,99\n switchport trunk native vlan 999</pre>`, ['vlan', 'trunk']);
  art('ios-routing', 'ios', 'Routing-Befehle', 'Spickzettel für Layer 3.', `<pre class="code">ip routing                          ! Layer-3-Switch\ninterface vlan 10\n ip address 10.10.0.1 255.255.255.0\n no shutdown\nip route 10.20.0.0 255.255.255.0 192.168.1.2\nip route 0.0.0.0 0.0.0.0 203.0.113.1</pre>`, ['svi', 'routing-tabelle', 'default-route']);

  // ---------------------------------------------------------------- Glossar
  art('osi', 'glossar', 'OSI-Modell', 'Sieben Schichten als Denkmodell.', tbl(['Schicht', 'Name', 'Beispiel'], [['7', 'Anwendung', 'HTTP, DNS, SSH'], ['6', 'Darstellung', 'TLS, Zeichensätze'], ['5', 'Sitzung', 'Sitzungsaufbau'], ['4', 'Transport', 'TCP, UDP'], ['3', 'Vermittlung', 'IP, Router, ICMP'], ['2', 'Sicherung', 'Ethernet, MAC, Switch, VLAN'], ['1', 'Bitübertragung', 'Kabel, Transceiver, Licht']]) + `<p>Bei Fehlersuche von unten nach oben prüfen: Kabel und Link (1), VLAN und MAC (2), IP und Route (3), Port und Dienst (4/7).</p>`, ['tcp-udp', 'icmp-ping']);
  art('tcp-udp', 'glossar', 'TCP, UDP und wichtige Ports', 'Transportprotokolle und Standardports.', tbl(['Port', 'Dienst'], [['22/TCP', 'SSH'], ['23/TCP', 'Telnet (unsicher)'], ['53/UDP+TCP', 'DNS'], ['67-68/UDP', 'DHCP'], ['80/TCP', 'HTTP'], ['123/UDP', 'NTP'], ['161/UDP', 'SNMP'], ['443/TCP', 'HTTPS'], ['514/UDP', 'Syslog'], ['1812/UDP', 'RADIUS'], ['3260/TCP', 'iSCSI']]) + `<p><b>TCP</b> baut eine Verbindung auf und sichert zuverlässige Zustellung. <b>UDP</b> ist verbindungslos und schnell.</p>`, ['osi', 'http']);
  art('mtu', 'glossar', 'MTU und Jumbo Frames', 'Größe eines Pakets.', `<p>Die MTU ist die maximale Paketgröße, standardmäßig <b>1500 Bytes</b>. <b>Jumbo Frames</b> (bis 9000, auf Switches oft 9216) reduzieren den Overhead bei Storage-Verkehr (iSCSI, RoCE). Wichtig: Die MTU muss auf dem <b>gesamten Pfad</b> gleich groß sein, sonst gibt es Fragmentierung oder verlorene Pakete.</p>`, ['iscsi', 'roce']);
  art('rack-unit', 'glossar', 'Höheneinheit (HE / RU)', 'Maß für Geräte im 19-Zoll-Rack.', `<p>Eine HE (engl. Rack Unit, U) ist <b>44,45 mm</b> hoch. Ein Switch ist meist 1 HE, ein Server 1 oder 2 HE, ein Rack hat typischerweise 42 HE. Der Planer rechnet mit 42 HE.</p>` + plan('Rack-Ansicht: Geräte lassen sich per Ziehen auf freie HE verschieben.'), ['typ-server']);
  art('bandbreite-latenz', 'glossar', 'Bandbreite, Durchsatz, Latenz, Jitter', 'Vier Begriffe, die oft verwechselt werden.', tbl(['Begriff', 'Bedeutung'], [['Bandbreite', 'Maximale Datenrate einer Leitung (z. B. 10 Gbit/s)'], ['Durchsatz', 'Tatsächlich übertragene Datenmenge pro Zeit'], ['Latenz', 'Laufzeit eines Pakets (ms, mit Ping messbar)'], ['Jitter', 'Schwankung der Latenz, wichtig für Telefonie']]), ['icmp-ping']);
  art('spof', 'glossar', 'Redundanz, SPOF und Hochverfügbarkeit', 'Wie man Ausfälle überlebt.', `<p>Ein <b>Single Point of Failure</b> (SPOF) ist eine Komponente, deren Ausfall alles lahmlegt, etwa ein einzelner Uplink oder ein Switch. Gegenmittel: doppelte Netzteile, [[etherchannel|EtherChannel]], zwei Switches, [[multipath|Multipathing]], zwei [[controller-ha|Controller]]. Der Planer prüft die Verkabelung und zeigt mit „Ausfall“, was passiert, wenn du ein Gerät oder Kabel entfernst.</p>`, ['etherchannel', 'multipath', 'controller-ha']);
  art('snmp-ntp', 'glossar', 'SNMP und NTP', 'Überwachung und Uhrzeit.', `<p><b>SNMP</b> fragt Zustände und Zähler von Geräten ab (Auslastung, Port-Status) und sendet Traps bei Ereignissen. <b>NTP</b> gleicht die Uhrzeit ab. Gleiche Zeit ist Pflicht, damit Logdateien mehrerer Geräte zusammenpassen und Zertifikate gültig bleiben.</p>`, ['syslog']);
  art('cli', 'glossar', 'CLI und GUI', 'Kommandozeile und grafische Oberfläche.', `<p>Die <b>CLI</b> (Command Line Interface) ist die Textkonsole eines Geräts. Sie ist schnell, skriptbar und überall gleich. Eine <b>GUI</b> ist die grafische Oberfläche. Netzwerkgeräte werden fast immer per CLI (über SSH) konfiguriert.</p>`, ['ios-grundlagen', 'linux-grundlagen']);

  // ---------------------------------------------------------------- Generierte Artikel
  const hwBlurb = {
    'C9200L-24P-4X': 'Access-Switch für Büro und Etagen. 24 PoE+-Ports versorgen Telefone und Access Points, vier 10G-Uplinks gehen zum Core.',
    'C9200L-48P-4X': 'Access-Switch mit 48 PoE+-Ports für große Etagen. Vier 10G-Uplinks.',
    'C9500-16X': 'Kompakter 10G-Core- oder Aggregations-Switch mit 16 SFP+-Ports.',
    'C9500-24Y4C': 'Core-Switch für Rechenzentrum und Campus: 24 Ports mit 10/25G und vier 100G-Uplinks. Eignet sich als Anschluss für Server mit 25G und RoCE.',
    'C1000-8T-2G-L': 'Kleiner Layer-2-Switch für Außenstellen und Labore. 8 Kupferports, 2 SFP-Uplinks.',
    'MDS-9132T': 'SAN-Switch mit 32 Fibre-Channel-Ports (bis 32G). Verbindet HBAs der Server mit dem Storage und setzt das Zoning um.',
    'ISR4331': 'Router für kleine und mittlere Standorte. Dient als Edge-Router zum Provider oder als WAN-/VPN-Router.',
    'ASA-5516-X': 'Firewall mit acht Gigabit-Ports und einem Management-Port. Trennt inside, outside und DMZ per Security-Level.',
    'HW-2288H-V5': 'Rack-Server (2 HE) mit vier PCIe-Slots, geeignet für Datenbanken und Virtualisierung. Fernwartung über iBMC.',
    'HW-1288H-V5': 'Rack-Server (1 HE) mit zwei PCIe-Slots, kompakt für Webdienste.',
    'HW-TaiShan-2280': 'ARM-basierter Server (2 HE) von Huawei, für Cloud- und Big-Data-Lasten.',
    'SRV-1U': 'Generischer 1-HE-Server mit zwei 10G-SFP+-Ports.', 'SRV-2U': 'Generischer 2-HE-Server mit zwei 10G-SFP+-Ports und vier PCIe-Slots.',
    'HW-Dorado-5000V6': 'All-Flash-Storage mit zwei Controllern und NVMe-Technik. Anbindung über FC, iSCSI oder RoCE-Karten.',
    'STO-GEN': 'Generisches Storage-System mit zwei Controllern.',
    'Server': 'Einfacher Server mit einem Port, für Dienste wie Web, DNS und DHCP. Hat ein Linux-Terminal.', 'ISP-Cloud': 'Simuliertes Internet mit DNS und Webserver. Hier endet der Uplink des Firmennetzes.',
    'PC': 'Arbeitsplatz-PC oder Notebook mit einem Ethernet-Port.', 'IP-Phone': 'IP-Telefon, wird meist per PoE versorgt.', 'Printer': 'Netzwerkdrucker.'
  };
  const TYPEART = { switch: 'typ-switch', router: 'typ-router', fc: 'typ-fc', server: 'typ-server', storage: 'typ-storage' };
  const idOf = (p, k) => p + '-' + String(k).toLowerCase();
  function portSummary(M) {
    if (!M.ports) return '';
    const c = {}; M.ports.forEach(([n, k]) => { c[k] = (c[k] || 0) + 1; }); const KIND = N.KIND || {};
    return tbl(['Port-Typ', 'Anzahl'], Object.entries(c).map(([k, n]) => [(KIND[k] && KIND[k].label) || k, n]));
  }
  function genDevices() {
    return Object.entries(N.MODELS).map(([k, M]) => {
      const rel = [TYPEART[M.type] || (M.fw ? 'typ-firewall' : null)].filter(Boolean); if (M.fw) rel.unshift('typ-firewall'); if (M.type === 'server' && M.slots) rel.push('pcie-karten', 'ibmc'); if (M.type === 'storage') rel.push('lun', 'controller-ha');
      const rows = [['Hersteller', M.vendor || 'Generisch'], ['Typ', M.fw ? 'Firewall' : ({ switch: 'Switch', router: 'Router', fc: 'FC-Switch', server: 'Server', storage: 'Storage', pc: 'Endgerät' }[M.type] || M.type)]];
      if (M.u) rows.push(['Bauhöhe', M.u + ' HE']); if (M.slots) rows.push(['Einsteckplätze', M.slots + (M.type === 'storage' ? ' je Controller' : ' PCIe-Slots')]); if (M.info) rows.push(['Ausstattung', (M.info || '').replace(' (vereinfachtes Planungsmodell)', '')]);
      const cards = M.slots ? `<h3>Passende Karten</h3>` + ul(Object.entries(N.CARDS).filter(([, c]) => c.for === M.type).map(([ck, c]) => `[[${idOf('card', ck)}|${c.label}]]`)) : '';
      const note = /vereinfachtes Planungsmodell/.test(M.info || '') ? `<p class="wk-note">Hinweis: Die Slot-Zahlen und die Standardbestückung sind Planungsannahmen. Vor einer Bestellung mit dem Datenblatt abgleichen.</p>` : '';
      return { id: idOf('hw', k), cat: 'geraete', title: M.label.replace(/ \(.*\)$/, ''), short: (hwBlurb[k] || M.info || '').split(/(?<=\.)\s+/)[0], body: (hwBlurb[k] ? `<p>${hwBlurb[k].split(/(?<=\.)\s+/).slice(1).join(' ')}</p>` : '') + tbl(['Merkmal', 'Wert'], rows) + portSummary(M) + cards + note + plan('Du findest das Modell in der Geräteleiste links (Netzwerk, Firewall, Server, Storage, Endgeräte).'), rel, tags: [M.vendor, M.type, M.label].join(' '), gen: true };
    });
  }
  function genCards() {
    return Object.entries(N.CARDS).map(([k, c]) => ({
      id: idOf('card', k), cat: 'ports', title: c.label.replace(/ \(.*\)$/, '') + (c.for === 'storage' ? ' (Storage)' : ''), short: `${c.for === 'storage' ? 'Interface-Modul' : 'Steckkarte'} mit ${c.n} Port${c.n > 1 ? 's' : ''}${c.roce ? ', RoCE-fähig' : ''}.`,
      body: `<p>${c.label}.</p>` + tbl(['Merkmal', 'Wert'], [['Einsatz', c.for === 'storage' ? 'Storage-Controller' : 'Server (PCIe)'], ['Ports', c.n + '× ' + ((N.KIND[c.kind] || {}).label || c.kind)], ['RoCE', c.roce ? 'ja' : 'nein']]) + (c.kind === 'fc' ? `<p>FC-Ports brauchen FC-Transceiver und führen in ein Fibre-Channel-Netz ([[fc-grundlagen]]).</p>` : `<p>Welche Module und Kabel passen, steht unter [[formfaktoren]] und [[transceiver-grundlagen]].</p>`) + (c.roce ? `<p>RoCE braucht ein verlustfreies Netz: [[roce]], [[pfc]].</p>` : ''),
      rel: ['pcie-karten', 'formfaktoren'].concat(c.kind === 'fc' ? ['hba'] : []), tags: c.label, gen: true
    }));
  }
  function genXcvr() {
    const mediaName = { cu: 'Kupfer (RJ45)', mmf: 'Glasfaser Multimode (OM3/OM4)', smf: 'Glasfaser Singlemode (OS2)' };
    const kindFor = s => s <= 1000 ? 'SFP' : s <= 10000 ? 'SFP+' : s <= 25000 ? 'SFP28' : 'QSFP28';
    return Object.entries(N.XCVR).map(([k, x]) => ({
      id: idOf('xcvr', k), cat: 'ports', title: `${k}: ${x.label}`, short: `${N.fmtSpeed ? N.fmtSpeed(x.speed) : x.speed + ' Mbit/s'}, ${mediaName[x.media]}.`,
      body: tbl(['Merkmal', 'Wert'], [['Standard', x.label], ['Geschwindigkeit', N.fmtSpeed ? N.fmtSpeed(x.speed) : x.speed + ' Mbit/s'], ['Medium', mediaName[x.media]], ['Protokoll', x.proto === 'fc' ? 'Fibre Channel' : 'Ethernet'], ['Bauform', x.proto === 'fc' ? 'FC-SFP+' : kindFor(x.speed)]]) +
        `<p>${x.media === 'mmf' ? 'Passt auf Multimode-Kabel ([[kabel-mmf]]).' : x.media === 'smf' ? 'Passt auf Singlemode-Kabel ([[kabel-smf]]).' : 'Passt auf Kupferkabel ([[kabel-cu]]).'} Die Gegenstelle braucht denselben Typ.</p>` + (x.proto === 'fc' ? `<p>Nur für Fibre-Channel-Ports in FC-Switches und HBAs ([[fc-grundlagen]]).</p>` : ''),
      rel: ['transceiver-grundlagen', 'formfaktoren', x.media === 'cu' ? 'kabel-cu' : x.media === 'mmf' ? 'kabel-mmf' : 'kabel-smf'], tags: k + ' ' + x.label + ' transceiver sfp', gen: true
    }));
  }

  let cache = null;
  const all = () => cache || (cache = A.concat(genDevices(), genCards(), genXcvr()));
  const get = id => all().find(a => a.id === id) || null;
  const plain = h => String(h).replace(/<[^>]*>/g, ' ').replace(/\[\[([^\]|]+)\|?([^\]]*)\]\]/g, (m, i, t) => t || i).replace(/&[a-z]+;/g, ' ').replace(/\s+/g, ' ').toLowerCase();
  function search(q) {
    q = String(q || '').trim().toLowerCase(); if (!q) return []; const ws = q.split(/\s+/);
    return all().map(a => { const t = a.title.toLowerCase(), sh = a.short.toLowerCase(), tg = (a.tags || '').toLowerCase(), b = a._p || (a._p = plain(a.body)); let sc = 0;
      for (const w of ws) { let s = 0; if (t === w) s = 100; else if (t.startsWith(w)) s = 60; else if (t.includes(w)) s = 40; else if (tg.includes(w) || a.id.includes(w)) s = 25; else if (sh.includes(w)) s = 15; else if (b.includes(w)) s = 5; if (!s) return null; sc += s; } return { a, sc }; })
      .filter(Boolean).sort((x, y) => y.sc - x.sc || x.a.title.localeCompare(y.a.title, 'de')).map(x => x.a);
  }
  const links = body => String(body).replace(/\[\[([^\]|]+)(?:\|([^\]]*))?\]\]/g, (m, id, txt) => { const a = get(id); return a ? `<a class="wk-link" href="#wiki/${id}">${txt || a.title}</a>` : (txt || id); });
  const byCat = c => all().filter(a => a.cat === c).sort((x, y) => (x.gen ? 1 : 0) - (y.gen ? 1 : 0));
  return { CATS, all, get, search, links, byCat };
})();
if (typeof module !== 'undefined') module.exports = WIKI;
